# final production candidate gate: r42-20260921-v2
# final production candidate gate: r42-20260921
# refresh after tagged SQL delimiter repair
# refresh after SQL quoting repair
name: Neon Schema Smoke Test

on:
  push:
    branches: [main, reference-parity-r42]
    paths:
      - "database/migrations/**"
      - "database/install-master.sh"
      - "database/runtime-role.sql"
      - "database/provisioner-role.sql"
      - "database/tenant-template/**"
      - ".github/workflows/schema-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edusentia-database-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Require deployment database credential
        run: |
          test -n "$BOOTSTRAP_DATABASE_URL" || { echo "DATABASE_URL/NEON_DATABASE_URL is required for schema smoke tests."; exit 1; }

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Route parity smoke to non-primary Neon branch
        if: github.ref == 'refs/heads/reference-parity-r42'
        shell: bash
        env:
          PARITY_DATABASE_HOST: ep-shy-meadow-b5e4d9e4.c-7.us-east-2.aws.neon.tech
        run: |
          set -euo pipefail
          PARITY_DATABASE_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" PARITY_DATABASE_HOST="$PARITY_DATABASE_HOST" node --input-type=module -e '
            const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);
            u.hostname=process.env.PARITY_DATABASE_HOST;
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$PARITY_DATABASE_URL"
          echo "BOOTSTRAP_DATABASE_URL=$PARITY_DATABASE_URL" >> "$GITHUB_ENV"
          echo "CI_TEMPLATE_DATABASE=edusentia_ci_base_v2" >> "$GITHUB_ENV"
          PARITY_DB_NAME="$(psql "$PARITY_DATABASE_URL" -Atc "select current_database()")"
          PARITY_DB_ROLE="$(psql "$PARITY_DATABASE_URL" -Atc "select session_user||'|'||current_user||'|'||current_setting('role')")"
          test "$PARITY_DB_NAME" = "edusentia"
          test "$PARITY_DB_ROLE" = "edusentia_runtime|edusentia_runtime|none"
          test "$(psql "$PARITY_DATABASE_URL" -Atc "select pg_has_role('edusentia_runtime','edusentia_provisioner','set')")" = "t"
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='edusentia_ci_base_v2' and pid<>pg_backend_pid();" >/dev/null
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter database edusentia_ci_base_v2 with allow_connections false;"
          test "$(psql "$PARITY_DATABASE_URL" -Atc "select datistemplate and not datallowconn from pg_database where datname='edusentia_ci_base_v2'")" = "t"
          echo "Parity direct endpoint, deployment runtime identity, and locked CI seed verified."

      - name: Fresh database migration smoke test
        shell: bash
        run: |
          set -euo pipefail
          PROBE_DB="edusentia_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          PROBE_DB="${PROBE_DB//-/_}"
          PROBE_DB="${PROBE_DB:0:60}"
          echo "Using disposable database $PROBE_DB"

          cleanup() {
            if [ -n "${CI_TEMPLATE_DATABASE:-}" ]; then
              psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 >/dev/null 2>&1 <<SQL || true
          set role edusentia_provisioner;
          drop database if exists "$PROBE_DB" with (force);
          SQL
            else
              psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop database if exists \"$PROBE_DB\" with (force);" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          cleanup
          if [ -n "${CI_TEMPLATE_DATABASE:-}" ]; then
            psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='$CI_TEMPLATE_DATABASE' and usename=current_user and pid<>pg_backend_pid();" >/dev/null

            psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 <<SQL
          set role edusentia_provisioner;
          create database "$PROBE_DB" owner edusentia_provisioner template "$CI_TEMPLATE_DATABASE";
          grant connect,create,temp on database "$PROBE_DB" to edusentia_runtime;
          SQL
          else
            psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database \"$PROBE_DB\";"
          fi

          PROBE_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" PROBE_DB="$PROBE_DB" node --input-type=module -e 'const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);u.pathname="/"+process.env.PROBE_DB;process.stdout.write(u.toString())')"
          echo "::add-mask::$PROBE_URL"
          psql "$PROBE_URL" -v ON_ERROR_STOP=1 -c "set role edusentia_provisioner; grant usage,create on schema public to edusentia_runtime; reset role;"
          PROBE_IDENTITY="$(psql "$PROBE_URL" -Atc "select session_user||'|'||current_user||'|'||current_setting('role')||'|'||pg_get_userbyid(datdba)||'|'||has_database_privilege(current_user,current_database(),'create') from pg_database where datname=current_database()")"
          test "$PROBE_IDENTITY" = "edusentia_runtime|edusentia_runtime|none|edusentia_provisioner|true"
          echo "Disposable runtime migration identity verified."

          BOOTSTRAP_DATABASE_URL="$PROBE_URL" bash database/install-master.sh
          psql "$PROBE_URL" -v ON_ERROR_STOP=1 -f database/runtime-role.sql

          test "$(psql "$PROBE_URL" -Atc "select schema_version from app.release_identity where edition='Edusentia Enterprise Neon Edition' limit 1")" = "0025"
          test "$(psql "$PROBE_URL" -Atc "select count(*) from information_schema.tables where table_schema='platform' and table_name='school_deletion_jobs'")" = "1"
          test "$(psql "$PROBE_URL" -Atc "select count(*) from information_schema.columns where table_schema='authn' and table_name='mfa_totp_factors' and column_name='friendly_name'")" = "1"
          echo "Fresh Neon schema migration smoke test passed."
