name: Deploy GitHub Pages
on:
  push: {branches: [main], paths: ["frontend/**","scripts/**","package.json","package-lock.json",".github/workflows/deploy-pages.yml"]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --ignore-scripts
      - run: npm run verify:no-supabase
      - run: npm run verify:pages
      - run: npm test
      - id: api
        name: Detect configured Worker API
        shell: bash
        run: |
          if grep -q "REPLACE_WITH_WORKER" frontend/config.js; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Worker API URL is not configured yet; deployment is intentionally skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.api.outputs.configured == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.api.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v3
        with: {path: frontend}
      - id: deployment
        if: steps.api.outputs.configured == 'true'
        uses: actions/deploy-pages@v4
