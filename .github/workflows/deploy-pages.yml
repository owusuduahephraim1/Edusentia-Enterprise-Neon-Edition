name: Deploy GitHub Pages
on:
  push: {branches: [main], paths: ["frontend/**","scripts/**","package.json","package-lock.json",".github/workflows/deploy-pages.yml"]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --ignore-scripts
      - run: npm run verify:no-supabase
      - run: npm run verify:pages
      - run: npm test
      - id: api
        name: Detect configured Worker API
        shell: bash
        run: |
          if grep -q "REPLACE_WITH_WORKER" frontend/config.js; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Worker API URL is not configured yet; deployment is intentionally skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.api.outputs.configured == 'true'
        name: Stage certified reference hero asset
        shell: bash
        run: |
          mkdir -p frontend/assets
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/nduah385/Edusentia-Enterprise/a181e18e0ca044db756193209b5b089cd03efb0f/assets/edusentia-auth-learning.webp" \
            -o frontend/assets/edusentia-auth-learning.webp
          test "$(sha256sum frontend/assets/edusentia-auth-learning.webp | awk '{print $1}')" = "916a25b9c34991f05318ab2f7306cf854adb6b03ca6d4416bb16ce90f0976de1"
      - if: steps.api.outputs.configured == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.api.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v3
        with: {path: frontend}
      - id: deployment
        if: steps.api.outputs.configured == 'true'
        uses: actions/deploy-pages@v4
