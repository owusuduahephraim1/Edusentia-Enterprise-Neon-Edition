# final production candidate gate: r42-20260921-v3
# final production candidate gate: r42-20260921-v2
# final production candidate gate: r42-20260921
# final release revalidation: locked-ci-seed
# refresh after tagged tenant delimiter repair
# refresh after SQL quoting repair
name: Reference Tenant Compatibility Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edusentia-database-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certified-core:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Require Neon deployment credential
        run: test -n "$BOOTSTRAP_DATABASE_URL"
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Route parity smoke to non-primary Neon branch
        if: github.ref == 'refs/heads/reference-parity-r42'
        shell: bash
        env:
          PARITY_DATABASE_HOST: ep-shy-meadow-b5e4d9e4.c-7.us-east-2.aws.neon.tech
        run: |
          set -euo pipefail
          PARITY_DATABASE_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" PARITY_DATABASE_HOST="$PARITY_DATABASE_HOST" node --input-type=module -e '
            const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);
            u.hostname=process.env.PARITY_DATABASE_HOST;
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$PARITY_DATABASE_URL"
          echo "BOOTSTRAP_DATABASE_URL=$PARITY_DATABASE_URL" >> "$GITHUB_ENV"
          echo "CI_TEMPLATE_DATABASE=edusentia_ci_base_v2" >> "$GITHUB_ENV"
          PARITY_DB_NAME="$(psql "$PARITY_DATABASE_URL" -Atc "select current_database()")"
          PARITY_DB_ROLE="$(psql "$PARITY_DATABASE_URL" -Atc "select session_user||'|'||current_user||'|'||current_setting('role')")"
          test "$PARITY_DB_NAME" = "edusentia"
          test "$PARITY_DB_ROLE" = "edusentia_runtime|edusentia_runtime|none"
          test "$(psql "$PARITY_DATABASE_URL" -Atc "select pg_has_role('edusentia_runtime','edusentia_provisioner','set')")" = "t"
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='edusentia_ci_base_v2' and pid<>pg_backend_pid();" >/dev/null
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter database edusentia_ci_base_v2 with allow_connections false;"
          test "$(psql "$PARITY_DATABASE_URL" -Atc "select datistemplate and not datallowconn from pg_database where datname='edusentia_ci_base_v2'")" = "t"
          echo "Parity direct endpoint, deployment runtime identity, and locked CI seed verified."
      - name: Install certified core into disposable isolated tenant
        shell: bash
        run: |
          set -euo pipefail
          DB="edusentia_ref_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          DB="${DB//-/_}"; DB="${DB:0:60}"
          cleanup(){
            if [ -n "${CI_TEMPLATE_DATABASE:-}" ]; then
              psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 >/dev/null 2>&1 <<SQL || true
          set role edusentia_provisioner;
          drop database if exists "$DB" with (force);
          SQL
            else
              psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop database if exists \"$DB\" with (force);" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          cleanup
          if [ -n "${CI_TEMPLATE_DATABASE:-}" ]; then
            psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='$CI_TEMPLATE_DATABASE' and usename=current_user and pid<>pg_backend_pid();" >/dev/null

            psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 <<SQL
          set role edusentia_provisioner;
          create database "$DB" owner edusentia_provisioner template "$CI_TEMPLATE_DATABASE";
          grant connect,create,temp on database "$DB" to edusentia_runtime;
          SQL
          else
            psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database \"$DB\";"
          fi
          URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" DB="$DB" node --input-type=module -e 'const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);u.pathname="/"+process.env.DB;process.stdout.write(u.toString())')"
          echo "::add-mask::$URL"
          psql "$URL" -v ON_ERROR_STOP=1 -c "set role edusentia_provisioner; grant usage,create on schema public to edusentia_runtime; reset role;"

          for migration in \
            database/migrations/0001_platform_and_context.sql \
            database/migrations/0002_identity_auth.sql \
            database/migrations/0003_school_people.sql \
            database/migrations/0004_academics_reporting.sql \
            database/migrations/0005_finance_hr_admissions.sql \
            database/migrations/0006_audit_storage_security.sql \
            database/migrations/0007_rls_and_runtime_grants.sql \
            database/migrations/0008_bootstrap_and_retention.sql \
            database/migrations/0009_academic_models.sql \
            database/migrations/0010_student_services.sql \
            database/migrations/0011_finance_enterprise.sql \
            database/migrations/0012_documents_and_identity.sql \
            database/migrations/0013_operations_compliance.sql \
            database/migrations/0014_bootstrap_auth_hardening.sql \
            database/migrations/0016_mfa_login_challenges.sql
          do psql "$URL" -v ON_ERROR_STOP=1 -f "$migration"; done
          psql "$URL" -v ON_ERROR_STOP=1 -f database/tenant-template/0020_tenant_runtime_parity.sql
          TARGET_DATABASE_URL="$URL" bash database/reference-compat/install-core.sh
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0028_certified_compat_foundation.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0029_certified_users_access_identity.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0030_certified_academic_configuration.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0030b_certified_teacher_principal_records.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0031_certified_academic_configuration_rpc.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0032_certified_academic_calendar_context.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0033_certified_student_management_utilities.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0034_certified_student_management_hardening.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0035_certified_teacher_principal_hardening.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0036_certified_staff_runtime_guards.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0037_certified_academic_configuration_mutations.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0038_certified_teacher_principal_crud.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0039_certified_timetable_academic_alignment.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0040_certified_audit_trail_v1.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0041_certified_notification_publication_sync.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0041b_neon_notification_recipient_compat.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0042_certified_principal_academic_history_read.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0043_certified_report_governance_prerequisites.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0043b_certified_report_assignment_scope.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0044_certified_report_workflow_privacy_integrity.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0044b_certified_report_transition_helpers.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0045_certified_report_pdf_integrity_r2.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0045b_neon_report_view_compat.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0045c_certified_operational_schema.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0045d_certified_rpc_helper_closure.sql
          echo "::group::Certified operational relation dependency inventory"
          psql "$URL" -Atc "with expected(name) as (select unnest(array['academic_period_controls','academic_years','assessment_components','assessment_schemes','assessment_score_entries','audit_log','audit_log_archive_entries','audit_log_archives','backup_exports','backup_storage_objects','certificate_batches','certificate_events','certificate_number_seq','certificate_templates','certificates','class_attendance_registers','class_subjects','class_timetable_entries','classes','client_error_events','data_retention_policies','emergency_academic_delegation_events','emergency_academic_delegations','enrollments','grading_scales','guardian_links','headteachers','id_card_deletion_tombstones','id_card_settings','notification_outbox','notifications','platform_access_locks','platform_distribution_authorities','privacy_requests','profiles','recovery_test_runs','report_card_templates','report_correction_events','report_correction_requests','report_publications','report_revisions','report_workflow_events','school_prospectus_items','school_prospectus_revisions','school_prospectus_sections','school_prospectuses','school_restore_jobs','school_settings','security_events','security_verification_runs','staff_id_cards','student_attendance_entries','student_guardians','student_id_cards','student_lifecycle_events','student_reports','students','subject_results','subjects','system_maintenance_log','teacher_award_categories','teachers','terms','transcript_issuances','transcript_number_seq','user_class_access']::text[])) select 'MISSING_RELATIONS='||coalesce(string_agg(name,',' order by name),'') from expected where to_regclass('public.'||name) is null"
          echo "::endgroup::"
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0046_certified_reference_rpc_bulk.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0047_certified_identity_rpc_neon.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048_certified_provider_rpc_neon_r2.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048b_certified_certificate_settings_compat.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048c_certified_backup_settings_compat.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048d_certified_system_health_telemetry_compat.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048e_certified_system_health_notification_compat.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048f_certified_backup_health_metadata_compat.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048g_certified_operational_rls_enforcement.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048h_certified_release_identity.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048i_historical_provider_bridges.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048j_notification_worker_compat.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048k_mfa_recovery_compat.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048l_backup_worker_api.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048m_restore_worker_helpers.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0048n_backup_maintenance_helpers.sql

          test "$(psql "$URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='students'")" = "1"
          test "$(psql "$URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='profiles'")" = "1"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_bootstrap_data'")" -ge 1
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_academic_configuration'")" -ge 1
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_academic_calendar_context'")" -ge 1
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in('list_teachers','save_teacher','list_headteachers','save_headteacher','get_my_teacher_profile','get_my_headteacher_signature')")" = "6"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='report_promotion_evaluation'")" -ge 1
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('save_academic_entity','archive_academic_entity','save_grading_scale','archive_grading_scale','save_assessment_scheme','save_class_subject_assignments_batch')")" = "6"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('generate_school_identifier','validate_student_import','save_promotion_cutoff')")" = "3"
          test "$(psql "$URL" -Atc "select to_regclass('public.class_timetable_entries') is not null")" = "t"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('get_class_timetable_console','save_class_timetable_entry')")" = "2"
          test "$(psql "$URL" -Atc "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='class_timetable_entries' and t.tgname='class_timetable_entries_broadcast' and not t.tgisinternal")" = "0"
          test "$(psql "$URL" -Atc "select to_regclass('public.audit_log_archives') is not null and to_regclass('public.audit_log_archive_entries') is not null")" = "t"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('list_audit_events_v2','list_audit_archives_v1','list_audit_archive_entries_v1')")" = "3"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='create_workflow_notifications'")" = "1"
          test "$(psql "$URL" -Atc "select position('guardian_links' in lower(pg_get_functiondef(p.oid)))>0 and position('s.profile_id' in lower(pg_get_functiondef(p.oid)))=0 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='create_workflow_notifications' limit 1")" = "t"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='search_students_v5'")" = "1"
          test "$(psql "$URL" -Atc "select to_regclass('public.academic_period_controls') is not null and to_regclass('public.emergency_academic_delegations') is not null and to_regclass('public.report_correction_requests') is not null and to_regclass('public.report_correction_events') is not null")" = "t"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('active_emergency_delegation_ids','has_active_emergency_delegation','is_official_class_teacher_for_class','is_official_subject_teacher_for_class','has_approved_report_correction','term_control_snapshot','term_phase_writable','can_manage_class_report_fields_scope','can_manage_class_report_fields_for_term','can_score_class_subject_scope','can_score_class_subject_for_term','get_my_emergency_academic_delegations','is_academic_manager','report_transition_deadline_allowed','mark_report_correction_applied')")" = "15"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('is_assigned_class_teacher','can_create_report_for_class_term')")" = "2"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('can_view_report_internal','get_report_revisions','get_report_headteacher_signature','get_report_editor','can_delete_report','delete_report_card_permanently','transition_report_status')")" = "7"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('can_submit_report','allowed_report_transitions')")" = "2"
          test "$(psql "$URL" -Atc "select not has_function_privilege('edusentia_worker_runtime','public.can_submit_report(uuid)','execute') and not has_function_privilege('edusentia_worker_runtime','public.allowed_report_transitions(uuid)','execute')")" = "t"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('finance_feature_enabled','finance_student_outstanding','finance_student_hold_status','can_publish_report','can_view_report_pdf','can_manage_report_pdf','can_delete_report_pdf_object','get_report_pdf_descriptor','list_report_pdf_paths','register_report_pdf')")" = "10"
          test "$(psql "$URL" -Atc "select to_regclass('public.finance_hold_policy') is not null and to_regclass('public.finance_hold_overrides') is not null")" = "t"
          test "$(psql "$URL" -Atc "select position('storage.object_metadata' in pg_get_functiondef(p.oid))>0 and position('storage.objects' in pg_get_functiondef(p.oid))=0 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='register_report_pdf' limit 1")" = "t"
          test "$(psql "$URL" -Atc "select count(*) from app.schema_migrations where version='0045b_neon_report_view_compat'")" = "1"
          test "$(psql "$URL" -Atc "select position('system_admin' in pg_get_functiondef(p.oid))>0 and position('principal' in pg_get_functiondef(p.oid))>0 and position('s.profile_id' in pg_get_functiondef(p.oid))=0 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='can_view_report' limit 1")" = "t"
          test "$(psql "$URL" -Atc "select count(*) from app.schema_migrations where version in('0046_certified_reference_rpc_bulk','0047_certified_identity_rpc_neon','0048_certified_provider_rpc_neon_r2','0048b_certified_certificate_settings_compat','0048c_certified_backup_settings_compat','0048d_certified_system_health_telemetry_compat','0048e_certified_system_health_notification_compat','0048f_certified_backup_health_metadata_compat','0048g_certified_operational_rls_enforcement','0048h_certified_release_identity','0048i_historical_provider_bridges','0048j_notification_worker_compat','0048k_mfa_recovery_compat','0048l_backup_worker_api','0048m_restore_worker_helpers','0048n_backup_maintenance_helpers')")" = "16"
          test "$(psql "$URL" -Atc "select count(distinct p.proname) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('academic_analytics','get_class_attendance_register','save_class_attendance','get_student_academic_history','get_school_prospectus_console','get_certificate_console','get_id_card_console','get_compliance_console','backup_dashboard','operations_dashboard','list_my_children_reports','generate_nip_user_email','get_emergency_delegation_console','list_guardian_portal_accounts','validate_operational_readiness','get_platform_license_console','get_school_license_capacity_console','issue_student_transcript','platform_set_license_override','set_school_logo_reference','verify_transcript')")" = "21"
          test "$(psql "$URL" -Atc "select position('authn.users' in pg_get_functiondef(p.oid))>0 and position('auth.users' in pg_get_functiondef(p.oid))=0 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='generate_nip_user_email' limit 1")" = "t"
          test "$(psql "$URL" -Atc "select position('storage.object_metadata' in pg_get_functiondef(p.oid))>0 and position('storage.objects' in pg_get_functiondef(p.oid))=0 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_school_license_capacity_console' limit 1")" = "t"
          test "$(psql "$URL" -Atc "select position('public.digest' in pg_get_functiondef(p.oid))>0 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='verify_transcript' limit 1")" = "t"
          test "$(psql "$URL" -Atc "select schema_version from app.release_identity where edition='Edusentia Enterprise Neon Edition' limit 1")" = "0048"

          echo "::group::Disposable certified RPC inventory"
          TARGET_DATABASE_URL="$URL" node scripts/reference-surface-inventory.mjs | tee /tmp/disposable-reference-surface.json
          node - <<'NODE'
          const fs=require("node:fs");
          const lines=fs.readFileSync("/tmp/disposable-reference-surface.json","utf8").trim().split(/\n/);
          const result=JSON.parse(lines.at(-1));
          if(result.referenceRpcCount!==172||result.executableReferenceRpcCount!==172||result.missingCount!==0||result.blockedCount!==0){
            console.error(result);
            process.exit(1);
          }
          console.log("Disposable certified RPC surface verified: 172/172 Worker-executable.");
          NODE
          echo "::endgroup::"

          echo "::group::Certified public function inventory"
          psql "$URL" -Atc "select p.proname||'('||pg_get_function_identity_arguments(p.oid)||')' from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and not exists (select 1 from pg_depend d join pg_extension e on e.oid=d.refobjid where d.classid='pg_proc'::regclass and d.objid=p.oid and d.deptype='e') order by 1"
          echo "::endgroup::"
          echo "Certified reference core compatibility smoke passed."
