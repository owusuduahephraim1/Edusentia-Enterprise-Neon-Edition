# refresh after tagged tenant delimiter repair
# refresh after SQL quoting repair
name: Reference Tenant Compatibility Smoke

on:
  push:
    branches: [reference-parity-r42]
    paths:
      - "database/reference-compat/**"
      - "database/tenant-template/**"
      - "database/migrations/0001_platform_and_context.sql"
      - "database/migrations/0002_identity_auth.sql"
      - "database/migrations/0003_school_people.sql"
      - "database/migrations/0004_academics_reporting.sql"
      - "database/migrations/0005_finance_hr_admissions.sql"
      - "database/migrations/0006_audit_storage_security.sql"
      - "database/migrations/0007_rls_and_runtime_grants.sql"
      - "database/migrations/0008_bootstrap_and_retention.sql"
      - "database/migrations/0009_academic_models.sql"
      - "database/migrations/0010_student_services.sql"
      - "database/migrations/0011_finance_enterprise.sql"
      - "database/migrations/0012_documents_and_identity.sql"
      - "database/migrations/0013_operations_compliance.sql"
      - "database/migrations/0014_bootstrap_auth_hardening.sql"
      - "database/migrations/0016_mfa_login_challenges.sql"
      - ".github/workflows/reference-compat-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-compat-smoke-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certified-core:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Require Neon deployment credential
        run: test -n "$BOOTSTRAP_DATABASE_URL"
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Install certified core into disposable isolated tenant
        shell: bash
        run: |
          set -euo pipefail
          DB="edusentia_ref_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          DB="${DB//-/_}"; DB="${DB:0:60}"
          cleanup(){ psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop database if exists \"$DB\" with (force);" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          psql "$BOOTSTRAP_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database \"$DB\";"
          URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" DB="$DB" node --input-type=module -e 'const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);u.pathname="/"+process.env.DB;process.stdout.write(u.toString())')"
          echo "::add-mask::$URL"

          for migration in \
            database/migrations/0001_platform_and_context.sql \
            database/migrations/0002_identity_auth.sql \
            database/migrations/0003_school_people.sql \
            database/migrations/0004_academics_reporting.sql \
            database/migrations/0005_finance_hr_admissions.sql \
            database/migrations/0006_audit_storage_security.sql \
            database/migrations/0007_rls_and_runtime_grants.sql \
            database/migrations/0008_bootstrap_and_retention.sql \
            database/migrations/0009_academic_models.sql \
            database/migrations/0010_student_services.sql \
            database/migrations/0011_finance_enterprise.sql \
            database/migrations/0012_documents_and_identity.sql \
            database/migrations/0013_operations_compliance.sql \
            database/migrations/0014_bootstrap_auth_hardening.sql \
            database/migrations/0016_mfa_login_challenges.sql
          do psql "$URL" -v ON_ERROR_STOP=1 -f "$migration"; done
          psql "$URL" -v ON_ERROR_STOP=1 -f database/tenant-template/0020_tenant_runtime_parity.sql
          TARGET_DATABASE_URL="$URL" bash database/reference-compat/install-core.sh
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0028_certified_compat_foundation.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0029_certified_users_access_identity.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0030_certified_academic_configuration.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0030b_certified_teacher_principal_records.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0031_certified_academic_configuration_rpc.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0032_certified_academic_calendar_context.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0033_certified_student_management_utilities.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0034_certified_student_management_hardening.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0035_certified_teacher_principal_hardening.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0036_certified_staff_runtime_guards.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0037_certified_academic_configuration_mutations.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0038_certified_teacher_principal_crud.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0039_certified_timetable_academic_alignment.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0040_certified_audit_trail_v1.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0041_certified_notification_publication_sync.sql
          psql "$URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0042_certified_principal_academic_history_read.sql

          test "$(psql "$URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='students'")" = "1"
          test "$(psql "$URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='profiles'")" = "1"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_bootstrap_data'")" -ge 1
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_academic_configuration'")" -ge 1
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_academic_calendar_context'")" -ge 1
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in('list_teachers','save_teacher','list_headteachers','save_headteacher','get_my_teacher_profile','get_my_headteacher_signature')")" = "6"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='report_promotion_evaluation'")" -ge 1
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('save_academic_entity','archive_academic_entity','save_grading_scale','archive_grading_scale','save_assessment_scheme','save_class_subject_assignments_batch')")" = "6"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('generate_school_identifier','validate_student_import','save_promotion_cutoff')")" = "3"
          test "$(psql "$URL" -Atc "select to_regclass('public.class_timetable_entries') is not null")" = "t"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('get_class_timetable_console','save_class_timetable_entry')")" = "2"
          test "$(psql "$URL" -Atc "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='class_timetable_entries' and t.tgname='class_timetable_entries_broadcast' and not t.tgisinternal")" = "0"
          test "$(psql "$URL" -Atc "select to_regclass('public.audit_log_archives') is not null and to_regclass('public.audit_log_archive_entries') is not null")" = "t"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('list_audit_events_v2','list_audit_archives_v1','list_audit_archive_entries_v1')")" = "3"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='create_workflow_notifications'")" = "1"
          test "$(psql "$URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='search_students_v5'")" = "1"
          test "$(psql "$URL" -Atc "select schema_version from app.release_identity where edition='Edusentia Enterprise Neon Edition' limit 1")" = "0042"

          echo "::group::Certified public function inventory"
          psql "$URL" -Atc "select p.proname||'('||pg_get_function_identity_arguments(p.oid)||')' from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and not exists (select 1 from pg_depend d join pg_extension e on e.oid=d.refobjid where d.classid='pg_proc'::regclass and d.objid=p.oid and d.deptype='e') order by 1"
          echo "::endgroup::"
          echo "Certified reference core compatibility smoke passed."
