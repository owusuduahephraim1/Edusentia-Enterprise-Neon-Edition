name: Build Permanent-Signed Neon Android

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - '.github/workflows/publish-signed-android.yml'

permissions:
  contents: read

jobs:
  android-production:
    name: Permanent-signed APK and AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.EDUSENTIA_NEON_ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EDUSENTIA_NEON_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.EDUSENTIA_NEON_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.EDUSENTIA_NEON_ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: "7B85FC220ACF4C96532B90DE72B3B05D85266696EDB0E9E3BBBF52CEAF334D8C"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Require permanent Android signing identity
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || {
              echo "Required permanent Android signing secret $name is missing." >&2
              exit 1
            }
          done

      - name: Prepare permanent signing keystore and release version
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/edusentia-neon-permanent-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          VERSION_CODE=$((704100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="7.4.0-neon-prod.$GITHUB_RUN_NUMBER"

          sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/" native/android/app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION_NAME\"/" native/android/app/build.gradle.kts

          echo "EDUSENTIA_NEON_ANDROID_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "EDUSENTIA_NEON_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "EDUSENTIA_NEON_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "EDUSENTIA_NEON_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Verify permanent keystore certificate before build
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FP=$(keytool -list -v             -keystore "$EDUSENTIA_NEON_ANDROID_KEYSTORE"             -storepass "$EDUSENTIA_NEON_ANDROID_KEYSTORE_PASSWORD"             -alias "$EDUSENTIA_NEON_ANDROID_KEY_ALIAS"             | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')

          test -n "$KEYSTORE_FP" || {
            echo "Unable to read permanent Android signing certificate fingerprint." >&2
            exit 1
          }

          if [ "$KEYSTORE_FP" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Permanent Android signing certificate does not match the pinned Edusentia Neon identity." >&2
            exit 1
          fi

          echo "Permanent Android signing certificate fingerprint verified."

      - name: Build production signed APK and Play AAB
        working-directory: native/android
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Verify APK AAB package identity and certificate
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find native/android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          AAB=$(find native/android/app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)
          test -n "$APK" && test -f "$APK"
          test -n "$AAB" && test -f "$AAB"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"

          APK_FP=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt"             | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')

          test "$APK_FP" = "$EXPECTED_CERT_SHA256" || {
            echo "Built APK is not signed with the permanent Edusentia Neon certificate." >&2
            exit 1
          }

          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='app.edusentia.enterprise.neon'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionCode='$ANDROID_RELEASE_VERSION_CODE'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='$ANDROID_RELEASE_VERSION_NAME'" "$RUNNER_TEMP/apk-badging.txt"

          jarsigner -verify -strict "$AAB"

      - name: Stage permanent-signed release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find native/android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          AAB=$(find native/android/app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)

          mkdir -p release-assets/android
          cp "$APK" release-assets/android/Edusentia-Enterprise-Neon-Android-Permanent-Signed.apk
          cp "$AAB" release-assets/android/Edusentia-Enterprise-Neon-Android-Play.aab

          cat > release-assets/android/SIGNING-CERTIFICATE.txt <<EOF
          Package: app.edusentia.enterprise.neon
          Version code: $ANDROID_RELEASE_VERSION_CODE
          Version name: $ANDROID_RELEASE_VERSION_NAME
          Certificate SHA-256: 7B:85:FC:22:0A:CF:4C:96:53:2B:90:DE:72:B3:B0:5D:85:26:66:96:ED:B0:E9:E3:BB:BF:52:CE:AF:33:4D:8C
          Signing identity: Edusentia Enterprise Neon Edition permanent Android release key
          EOF

          (cd release-assets/android && sha256sum             Edusentia-Enterprise-Neon-Android-Permanent-Signed.apk             Edusentia-Enterprise-Neon-Android-Play.aab             > SHA256SUMS-ANDROID.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: edusentia-neon-permanent-signed-android
          if-no-files-found: error
          retention-days: 90
          path: release-assets/android/*
