name: Diagnose Neon grading scale save
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-grading-scale.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
      - name: Inspect Nipe grading-scale runtime and rollback save probe
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$ADMIN_URL"
          TENANT_ROW="$(psql "$ADMIN_URL" -AtF '|' -c "
            select tc.tenant_code,tc.database_name
            from platform.tenant_control tc
            join app.tenants t on t.id=tc.tenant_id
            where lower(t.name) like '%nipe%'
            order by tc.created_at desc nulls last
            limit 1
          ")"
          test -n "$TENANT_ROW"
          TENANT_CODE="${TENANT_ROW%%|*}"
          TENANT_DB="${TENANT_ROW#*|}"
          echo "Tenant route: $TENANT_CODE -> $TENANT_DB"
          TENANT_URL="$(ADMIN_URL="$ADMIN_URL" TENANT_DB="$TENANT_DB" node --input-type=module -e '
            const u=new URL(process.env.ADMIN_URL);u.pathname="/"+process.env.TENANT_DB;process.stdout.write(u.toString())
          ')"
          echo "::add-mask::$TENANT_URL"

          echo "=== grading_scales columns ==="
          psql "$TENANT_URL" -P pager=off -c "
            select column_name,data_type,udt_name,is_nullable,column_default
            from information_schema.columns
            where table_schema='public' and table_name='grading_scales'
            order by ordinal_position
          "

          echo "=== grading_scales constraints ==="
          psql "$TENANT_URL" -P pager=off -c "
            select conname,contype,pg_get_constraintdef(oid)
            from pg_constraint
            where conrelid='public.grading_scales'::regclass
            order by conname
          "

          echo "=== grading_scales triggers ==="
          psql "$TENANT_URL" -P pager=off -c "
            select tgname,pg_get_triggerdef(oid)
            from pg_trigger
            where tgrelid='public.grading_scales'::regclass and not tgisinternal
            order by tgname
          "

          echo "=== save_grading_scale definition ==="
          psql "$TENANT_URL" -P pager=off -c "select pg_get_functiondef('public.save_grading_scale(jsonb)'::regprocedure)"

          echo "=== context candidate ==="
          CONTEXT_ROW="$(psql "$TENANT_URL" -AtF '|' -c "
            select t.id,m.user_id,m.role
            from app.tenants t
            join app.tenant_memberships m on m.tenant_id=t.id
            join authn.users u on u.id=m.user_id
            where m.role in ('system_admin','admin') and m.status='active' and u.disabled_at is null
            order by m.created_at
            limit 1
          ")"
          test -n "$CONTEXT_ROW"
          IFS='|' read -r TENANT_ID USER_ID ROLE <<< "$CONTEXT_ROW"
          echo "Context role: $ROLE"

          echo "=== rollback update probe ==="
          GRADE_JSON="$(psql "$TENANT_URL" -At -c "
            select jsonb_build_object(
              'id',g.id::text,'grade',g.grade,'min_mark',g.min_mark,'max_mark',g.max_mark,
              'remark',g.remark,'interpretation',g.interpretation,'grade_point',g.grade_point,
              'display_order',g.display_order,'academic_year_id',g.academic_year_id,
              'class_id',g.class_id,'subject_id',g.subject_id,'reason','Diagnostic rollback probe'
            )::text
            from public.grading_scales g
            where g.deleted_at is null
            order by g.display_order,g.min_mark desc
            limit 1
          ")"
          test -n "$GRADE_JSON"
          echo "::add-mask::$GRADE_JSON"
          PGOPTIONS='' psql "$TENANT_URL" -v ON_ERROR_STOP=1             -v tenant_id="$TENANT_ID" -v user_id="$USER_ID" -v app_role="$ROLE" -v payload="$GRADE_JSON" <<'SQL'
          begin;
          select app.set_request_context(:'tenant_id'::uuid,:'user_id'::uuid,:'app_role',2::smallint);
          select public.save_grading_scale(:'payload'::jsonb);
          rollback;
          SQL
