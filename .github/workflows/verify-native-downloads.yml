name: Native Document Download Verification

on:
  pull_request:
    paths:
      - 'native/android/**'
      - 'native/windows/**'
      - 'frontend/native-document-downloads.js'
      - 'tests/native-document-downloads.test.mjs'
      - '.github/workflows/verify-native-downloads.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile Android native download bridge
        working-directory: native/android
        run: gradle :app:assembleDebug --stacktrace

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Tauri Windows code and capabilities
        working-directory: native/windows/src-tauri
        run: cargo check
