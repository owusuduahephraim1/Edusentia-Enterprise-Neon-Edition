name: Tenant Operational Parity Verify

on:
  push:
    branches: [tenant-operational-parity-r42]
    paths:
      - ".github/workflows/tenant-operational-parity-verify.yml"
      - "database/**"
      - "worker/**"
      - "frontend/**"
      - "tests/**"
      - "reference/future-tenant-rpc-surface.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-operational-parity-${{ github.ref }}
  cancel-in-progress: false

env:
  CLONE_DATABASE_HOST: ep-cool-lake-b5b87yn7.c-7.us-east-2.aws.neon.tech
  CLONE_MASTER_DATABASE: edusentia
  CLONE_TEMPLATE_DATABASE: edusentia_operational_parity_ci

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run code and contract gates
        run: |
          npm run check
          npm test

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Build isolated clone URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_DATABASE_URL"
          CLONE_DATABASE_URL="$(SOURCE_DATABASE_URL="$SOURCE_DATABASE_URL" CLONE_DATABASE_HOST="$CLONE_DATABASE_HOST" CLONE_MASTER_DATABASE="$CLONE_MASTER_DATABASE" node --input-type=module -e '
            const u=new URL(process.env.SOURCE_DATABASE_URL);
            u.hostname=process.env.CLONE_DATABASE_HOST;
            u.pathname="/"+process.env.CLONE_MASTER_DATABASE;
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$CLONE_DATABASE_URL"
          echo "CLONE_DATABASE_URL=$CLONE_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Install fresh operational tenant template on clone
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_DATABASE_URL="$CLONE_DATABASE_URL" TENANT_TEMPLATE_DATABASE="$CLONE_TEMPLATE_DATABASE" bash database/tenant-template/install.sh

      - name: Verify complete 258-operation blueprint surface
        shell: bash
        run: |
          set -euo pipefail
          psql "$CLONE_DATABASE_URL" -v ON_ERROR_STOP=1             -c "set role edusentia_provisioner;"             -c "alter database \"$CLONE_TEMPLATE_DATABASE\" with allow_connections true;" >/dev/null
          TEMPLATE_DATABASE_URL="$(CLONE_DATABASE_URL="$CLONE_DATABASE_URL" CLONE_TEMPLATE_DATABASE="$CLONE_TEMPLATE_DATABASE" node --input-type=module -e '
            const u=new URL(process.env.CLONE_DATABASE_URL);
            u.pathname="/"+process.env.CLONE_TEMPLATE_DATABASE;
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$TEMPLATE_DATABASE_URL"

          EXPECTED_FILE="$(mktemp)"
          ACTUAL_FILE="$(mktemp)"
          MISSING_FILE="$(mktemp)"
          node --input-type=module -e '
            import fs from "node:fs";
            const x=JSON.parse(fs.readFileSync("reference/future-tenant-rpc-surface.json","utf8"));
            if(x.rpcCount!==258||x.operations.length!==258)throw new Error("Future tenant RPC manifest is not 258 operations");
            process.stdout.write([...new Set(x.operations)].sort().join("\n")+"\n");
          ' > "$EXPECTED_FILE"

          psql "$TEMPLATE_DATABASE_URL" -Atc "
            select distinct p.proname
            from pg_proc p
            join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and has_function_privilege('edusentia_worker_runtime',p.oid,'EXECUTE')
            order by p.proname
          " > "$ACTUAL_FILE"

          comm -23 "$EXPECTED_FILE" "$ACTUAL_FILE" > "$MISSING_FILE"
          if [ -s "$MISSING_FILE" ]; then
            echo "::error::Missing executable future-tenant RPCs:"
            cat "$MISSING_FILE"
            exit 1
          fi
          test "$(wc -l < "$EXPECTED_FILE" | tr -d ' ')" = "258"
          echo "Future tenant operational RPC surface verified: 258/258"

      - name: Relock clone template
        if: always()
        shell: bash
        run: |
          if [ -n "${CLONE_DATABASE_URL:-}" ]; then
            psql "$CLONE_DATABASE_URL" -v ON_ERROR_STOP=1               -c "set role edusentia_provisioner;"               -c "alter database \"$CLONE_TEMPLATE_DATABASE\" with allow_connections false;" >/dev/null 2>&1 || true
          fi
