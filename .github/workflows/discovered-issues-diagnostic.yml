name: Discovered Issues Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discovered-issues-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RAW_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify production repairs
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.RAW_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          TENANT_DATABASE_URL="$(ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.ADMIN_DATABASE_URL);
            u.pathname="/edusentia_nis_000001";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$ADMIN_DATABASE_URL"
          echo "::add-mask::$TENANT_DATABASE_URL"

          psql "$TENANT_DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          begin;
          set local role edusentia_worker_runtime;
          select app.set_request_context(
            (select id from app.tenants order by created_at limit 1),
            (select id from public.profiles where public.current_app_role_for(role)='system_admin' and active order by created_at limit 1),
            'system_admin',
            2::smallint
          );

          do $verify$
          declare
            term_id uuid;
            result jsonb;
            rows_count integer;
          begin
            if not exists(select 1 from app.schema_migrations where version='0061_discovered_operational_parity_repairs') then
              raise exception '0061 is not installed';
            end if;
            if not exists(select 1 from pg_attribute where attrelid='public.student_reports'::regclass and attname='archived_status' and not attisdropped) then
              raise exception 'student_reports.archived_status is missing';
            end if;

            select id into term_id from public.terms where deleted_at is null order by is_active desc,created_at desc limit 1;

            result:=public.list_report_cards_v6(term_id,null,null,'','active',1,100);
            if result is null or not (result ? 'rows') then raise exception 'Report Cards result is invalid'; end if;

            result:=public.operations_dashboard(term_id);
            if result is null or not (result ? 'cron_jobs') then raise exception 'Operations result is invalid'; end if;

            result:=public.neon_guardian_account_records();
            rows_count:=jsonb_array_length(coalesce(result,'[]'::jsonb));

            -- These two certified calls are also part of the Users & Access Promise.all.
            result:=public.list_profiles_with_access();
            if result is null or not (result ? 'profiles') then raise exception 'Users and Access profile payload is invalid'; end if;

            result:=public.list_guardian_portal_accounts('');
            if result is null then raise exception 'Guardian portal account payload is invalid'; end if;

            raise notice 'POSTFIX_DISCOVERED_ISSUES_OK reports=true operations=true users=true guardian_rows=%',rows_count;
          end
          $verify$;
          rollback;
          SQL
