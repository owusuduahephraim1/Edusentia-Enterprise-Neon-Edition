name: Discovered Issues Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discovered-issues-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RAW_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Diagnose production RPC and runtime read failures
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.RAW_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          TENANT_DATABASE_URL="$(ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.ADMIN_DATABASE_URL);
            u.pathname="/edusentia_nis_000001";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$ADMIN_DATABASE_URL"
          echo "::add-mask::$TENANT_DATABASE_URL"

          psql "$TENANT_DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          begin;
          set local role edusentia_worker_runtime;
          select app.set_request_context(
            (select id from app.tenants order by created_at limit 1),
            (select id from public.profiles where public.current_app_role_for(role)='system_admin' and active order by created_at limit 1),
            'system_admin',
            2::smallint
          );

          do $diag$
          declare
            term_id uuid;
            result jsonb;
            n integer;
          begin
            select id into term_id from public.terms where deleted_at is null order by is_active desc,created_at desc limit 1;

            begin
              result:=public.list_profiles_with_access();
              raise notice 'DIAG list_profiles_with_access OK';
            exception when others then
              raise notice 'DIAG list_profiles_with_access ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              result:=public.list_guardian_portal_accounts('');
              raise notice 'DIAG list_guardian_portal_accounts OK';
            exception when others then
              raise notice 'DIAG list_guardian_portal_accounts ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              result:=public.list_report_cards_v6(term_id,null,null,'','active',1,100);
              raise notice 'DIAG list_report_cards_v6 OK';
            exception when others then
              raise notice 'DIAG list_report_cards_v6 ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              result:=public.operations_dashboard(term_id);
              raise notice 'DIAG operations_dashboard OK';
            exception when others then
              raise notice 'DIAG operations_dashboard ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              result:=public.get_report_correction_console(term_id,null);
              raise notice 'DIAG get_report_correction_console OK';
            exception when others then
              raise notice 'DIAG get_report_correction_console ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              result:=public.list_academic_period_controls();
              raise notice 'DIAG list_academic_period_controls OK';
            exception when others then
              raise notice 'DIAG list_academic_period_controls ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              select count(*) into n
              from public.student_guardians sg
              left join lateral (
                select jsonb_agg(jsonb_build_object('student_id',s.id)) children
                from public.guardian_links gl2
                join public.students s on s.id=gl2.student_id and s.deleted_at is null and s.status='active'
                where gl2.guardian_id=sg.id
              ) children on true;
              raise notice 'DIAG guardian_runtime_query OK rows=%',n;
            exception when others then
              raise notice 'DIAG guardian_runtime_query ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            raise notice 'DIAG owners list_profiles=% reports=% ops=% correction=% controls=%',
              pg_get_userbyid((select proowner from pg_proc where oid='public.list_profiles_with_access()'::regprocedure)),
              pg_get_userbyid((select proowner from pg_proc where oid='public.list_report_cards_v6(uuid,uuid,public.report_status,text,text,integer,integer)'::regprocedure)),
              pg_get_userbyid((select proowner from pg_proc where oid='public.operations_dashboard(uuid)'::regprocedure)),
              pg_get_userbyid((select proowner from pg_proc where oid='public.get_report_correction_console(uuid,uuid)'::regprocedure)),
              pg_get_userbyid((select proowner from pg_proc where oid='public.list_academic_period_controls()'::regprocedure));
          end
          $diag$;
          rollback;
          SQL
