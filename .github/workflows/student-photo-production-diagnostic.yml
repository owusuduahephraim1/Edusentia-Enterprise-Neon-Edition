name: Student Photo Production Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/student-photo-production-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RAW_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Inspect student photo production contract
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.RAW_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          TENANT_DATABASE_URL="$(ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.ADMIN_DATABASE_URL);
            u.pathname="/edusentia_nis_000001";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$ADMIN_DATABASE_URL"
          echo "::add-mask::$TENANT_DATABASE_URL"

          echo "student_photo_function:"
          psql "$TENANT_DATABASE_URL" -Atc "
            select
              position('app.current_user_id()' in pg_get_functiondef('public.set_student_photo(uuid,text,timestamptz)'::regprocedure))>0,
              position('storage.object_metadata' in pg_get_functiondef('public.set_student_photo(uuid,text,timestamptz)'::regprocedure))>0,
              position('student-photos/' in pg_get_functiondef('public.set_student_photo(uuid,text,timestamptz)'::regprocedure))>0,
              position('target_student_id::text||''/%''' in pg_get_functiondef('public.set_student_photo(uuid,text,timestamptz)'::regprocedure))>0
          "

          echo "student_photo_rows:"
          psql "$TENANT_DATABASE_URL" -AtF '|' -c "
            select s.id,
                   s.photo_url,
                   coalesce(m.status::text,'NO_METADATA'),
                   coalesce(m.content_type,'')
            from public.students s
            left join storage.object_metadata m
              on m.tenant_id=app.current_tenant_id()
             and m.object_key=s.photo_url
            where btrim(coalesce(s.photo_url,''))<>''
            order by s.updated_at desc nulls last
            limit 10
          " || true

          echo "recent_student_photo_metadata:"
          psql "$TENANT_DATABASE_URL" -AtF '|' -c "
            select object_key,status,content_type,created_at
            from storage.object_metadata
            where object_key like 'tenants/%/student-photos/%'
            order by created_at desc
            limit 10
          " || true
