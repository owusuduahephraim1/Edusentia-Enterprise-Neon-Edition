name: Parity Tenant Template Install

on:
  push:
    branches: [reference-parity-r42]
    paths: [".github/workflows/parity-template-install.yml", "database/reference-compat/0044b_certified_report_transition_helpers.sql"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-tenant-template-install
  cancel-in-progress: false

env:
  PARITY_DATABASE_HOST: ep-shy-meadow-b5e4d9e4-pooler.c-7.us-east-2.aws.neon.tech
  PARITY_MASTER_DATABASE: edusentia
  PARITY_TEMPLATE_DATABASE: edusentia_tenant_template
  PARITY_TEST_TENANT_DATABASE: edusentia_rpt_000001

jobs:
  verify-and-provision:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require deployment database credential
        run: test -n "$SOURCE_DATABASE_URL"

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Build parity-only database URL
        shell: bash
        run: |
          set -euo pipefail
          PARITY_DATABASE_URL="$(SOURCE_DATABASE_URL="$SOURCE_DATABASE_URL" PARITY_DATABASE_HOST="$PARITY_DATABASE_HOST" PARITY_MASTER_DATABASE="$PARITY_MASTER_DATABASE" node --input-type=module -e '
            const u=new URL(process.env.SOURCE_DATABASE_URL);
            u.hostname=process.env.PARITY_DATABASE_HOST;
            u.pathname="/"+process.env.PARITY_MASTER_DATABASE;
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$PARITY_DATABASE_URL"
          echo "PARITY_DATABASE_URL=$PARITY_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Assert non-primary parity target
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$PARITY_DATABASE_URL" -Atc "select schema_version from app.release_identity where edition='Edusentia Enterprise Neon Edition' limit 1")" = "0025"
          test "$(psql "$PARITY_DATABASE_URL" -Atc "select count(*) from app.tenants where code='RPT-000001' and name='Reference Parity Test School'")" = "1"
          test "$(psql "$PARITY_DATABASE_URL" -Atc "select count(*) from app.schema_migrations")" = "25"
          echo "Parity branch target confirmed."

      - name: Apply certified report transition helper hotfix and verify template
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_ROLE="$(psql "$PARITY_DATABASE_URL" -Atc "select current_user")"
          TEMPLATE_OWNER="$(psql "$PARITY_DATABASE_URL" -Atc "select pg_get_userbyid(datdba) from pg_database where datname='$PARITY_TEMPLATE_DATABASE'")"
          test "$CURRENT_ROLE" = "edusentia_runtime"
          test "$TEMPLATE_OWNER" = "edusentia_runtime"

          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter database \"$PARITY_TEMPLATE_DATABASE\" with allow_connections true;"
          TEMPLATE_URL="$(PARITY_DATABASE_URL="$PARITY_DATABASE_URL" PARITY_TEMPLATE_DATABASE="$PARITY_TEMPLATE_DATABASE" node --input-type=module -e '
            const u=new URL(process.env.PARITY_DATABASE_URL);
            u.pathname="/"+process.env.PARITY_TEMPLATE_DATABASE;
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$TEMPLATE_URL"
          psql "$TEMPLATE_URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0044b_certified_report_transition_helpers.sql
          test "$(psql "$TEMPLATE_URL" -Atc "select schema_version from app.release_identity where edition='Edusentia Enterprise Neon Tenant Runtime' limit 1")" = "0020"
          test "$(psql "$TEMPLATE_URL" -Atc "select schema_version from app.release_identity where edition='Edusentia Enterprise Neon Edition' limit 1")" = "0045"
          test "$(psql "$TEMPLATE_URL" -Atc "select count(*) from app.schema_migrations")" = "38"
          test "$(psql "$TEMPLATE_URL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_bootstrap_data'")" -ge 1
          test "$(psql "$TEMPLATE_URL" -Atc "select has_table_privilege('edusentia_worker_runtime','app.students','select') and has_function_privilege('edusentia_worker_runtime','authn.lookup_login(text,text)','execute')")" = "t"

          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select pg_terminate_backend(pid) from pg_stat_activity where datname='$PARITY_TEMPLATE_DATABASE' and pid<>pg_backend_pid();" >/dev/null
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "revoke connect on database \"$PARITY_TEMPLATE_DATABASE\" from public;"
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "grant connect on database \"$PARITY_TEMPLATE_DATABASE\" to edusentia_runtime;"
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "grant connect on database \"$PARITY_TEMPLATE_DATABASE\" to edusentia_worker_runtime;"
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter database \"$PARITY_TEMPLATE_DATABASE\" with allow_connections false;"
          echo "Certified parity tenant template verified and locked."

      - name: Clone and initialize Reference Parity Test School
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(psql "$PARITY_DATABASE_URL" -Atc "select count(*) from pg_database where datname='$PARITY_TEST_TENANT_DATABASE'")" = "0" ]; then
            psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database \"$PARITY_TEST_TENANT_DATABASE\" template \"$PARITY_TEMPLATE_DATABASE\" owner edusentia_runtime;"
          fi
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "revoke connect on database \"$PARITY_TEST_TENANT_DATABASE\" from public;"
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "grant connect on database \"$PARITY_TEST_TENANT_DATABASE\" to edusentia_runtime;"
          psql "$PARITY_DATABASE_URL" -v ON_ERROR_STOP=1 -c "grant connect on database \"$PARITY_TEST_TENANT_DATABASE\" to edusentia_worker_runtime;"

          TENANT_URL="$(PARITY_DATABASE_URL="$PARITY_DATABASE_URL" PARITY_TEST_TENANT_DATABASE="$PARITY_TEST_TENANT_DATABASE" node --input-type=module -e '
            const u=new URL(process.env.PARITY_DATABASE_URL);
            u.pathname="/"+process.env.PARITY_TEST_TENANT_DATABASE;
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$TENANT_URL"

          psql "$TENANT_URL" -v ON_ERROR_STOP=1 -f database/reference-compat/0044b_certified_report_transition_helpers.sql
          test "$(psql "$TENANT_URL" -Atc "select count(*) from app.schema_migrations where version='0044b_certified_report_transition_helpers'")" = "1"

          if [ "$(psql "$TENANT_URL" -Atc "select count(*) from app.tenants where id='fff24cf5-ce88-4107-af80-eff8bba44d8c'::uuid")" = "0" ]; then
            psql "$TENANT_URL" -v ON_ERROR_STOP=1 -c "select app.platform_initialize_tenant(
              'fff24cf5-ce88-4107-af80-eff8bba44d8c'::uuid,
              'RPT-000001',
              'Reference Parity Test School',
              'basic_jhs',
              'reference@rpt000001.app',
              'Reference Admin',
              'professional',
              '2026-09-20T00:00:00Z'::timestamptz,
              '2027-09-19T23:59:59Z'::timestamptz
            );"
          fi

          test "$(psql "$TENANT_URL" -Atc "select schema_version from app.release_identity where edition='Edusentia Enterprise Neon Tenant Runtime' limit 1")" = "0020"
          test "$(psql "$TENANT_URL" -Atc "select schema_version from app.release_identity where edition='Edusentia Enterprise Neon Edition' limit 1")" = "0045"
          test "$(psql "$TENANT_URL" -Atc "select count(*) from app.tenants where id='fff24cf5-ce88-4107-af80-eff8bba44d8c'::uuid and code='RPT-000001'")" = "1"
          psql "$TENANT_URL" -Atc "select app.platform_health_snapshot('fff24cf5-ce88-4107-af80-eff8bba44d8c'::uuid);" > /tmp/parity-tenant-health.json
          test -s /tmp/parity-tenant-health.json
          echo "Reference Parity Test School isolated database initialized and verified."
