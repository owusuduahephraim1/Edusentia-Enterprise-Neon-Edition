name: Edusentia Public Website
on:
  pull_request:
    paths: ["public-site/**","scripts/validate-public-site.mjs",".github/workflows/deploy-public-site.yml"]
  push:
    branches: [main]
    paths: ["public-site/**","scripts/validate-public-site.mjs",".github/workflows/deploy-public-site.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: edusentia-public-site, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Stage public assets and validate
        run: |
          mkdir -p public-site/assets
          cp frontend/assets/edusentia-mark.svg public-site/assets/edusentia-mark.svg
          cp frontend/assets/public-about-education.webp public-site/assets/public-about-education.webp
          node scripts/validate-public-site.mjs
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check]
    environment:
      name: edusentia-public-site
      url: https://edusentia.com/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: edusentia-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Stage deploy assets
        run: |
          set -euo pipefail
          mkdir -p public-site/assets
          cp frontend/assets/edusentia-mark.svg public-site/assets/edusentia-mark.svg
          cp frontend/assets/public-about-education.webp public-site/assets/public-about-education.webp
          node scripts/validate-public-site.mjs
      - name: Ensure independent Pages project
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          status="$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$PROJECT")"
          if [ "$status" = 404 ]; then
            curl -fsS -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"edusentia-main","production_branch":"main"}' -o /tmp/project.json
          elif [ "$status" != 200 ]; then
            echo "::error::Cloudflare Pages project lookup failed: HTTP $status"
            exit 1
          fi
          jq -e '.success == true and .result.name == "edusentia-main"' /tmp/project.json >/dev/null
      - name: Deploy marketing site only
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy public-site --project-name="$PROJECT" --branch=main
      - name: Attach apex and www domains
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          response="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")"
          if ! jq -e '.success == true' <<<"$response" >/dev/null; then
            echo "::warning::Domain list unavailable; manual Cloudflare Pages configuration required."
            exit 0
          fi
          for domain in edusentia.com www.edusentia.com; do
            if jq -e --arg d "$domain" 'any(.result[]?; .name == $d)' <<<"$response" >/dev/null; then
              echo "Already attached: $domain"
              continue
            fi
            status="$(curl -sS -o /tmp/domain.json -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" -d "{\"name\":\"$domain\"}")"
            if [[ "$status" =~ ^2 ]] && jq -e '.success == true' /tmp/domain.json >/dev/null; then
              echo "Domain association accepted: $domain. DNS/TLS activation may remain pending."
            else
              echo "::warning::Domain association pending manual setup: $domain (HTTP $status)"
            fi
          done
      - name: Verify Pages preview
        run: |
          set -euo pipefail
          page="https://edusentia-main.pages.dev"
          ready=false
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 12 "$page/" -o /tmp/edusentia-marketing.html \
              && grep -Fq 'One platform.' /tmp/edusentia-marketing.html \
              && curl -fsSL --max-time 12 "$page/assets/edusentia-mark.svg" -o /tmp/edusentia-mark.svg; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          echo "## Edusentia public site" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: $page/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target domains: edusentia.com and www.edusentia.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing app and verification projects are untouched." >> "$GITHUB_STEP_SUMMARY"
