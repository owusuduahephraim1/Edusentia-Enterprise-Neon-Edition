name: Class Teacher Login Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/class-teacher-login-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RAW_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Inspect class teacher login and workspace bootstrap
        shell: bash
        run: |
          set -euo pipefail
          TENANT_DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.RAW_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia_nis_000001";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$TENANT_DATABASE_URL"

          psql "$TENANT_DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          begin;

          select set_config('diag.teacher_user_id',coalesce((
            select p.id::text
            from public.profiles p
            where public.current_app_role_for(p.role)::text='class_teacher'
              and p.active
            order by p.created_at desc
            limit 1
          ),''),true);

          select set_config('diag.tenant_id',(select id::text from app.tenants order by created_at limit 1),true);

          select 'CLASS_TEACHER_ACCOUNT '||coalesce((
            select jsonb_build_object(
              'user_id',p.id,
              'profile_role',public.current_app_role_for(p.role)::text,
              'profile_active',p.active,
              'mfa_required',p.mfa_required,
              'must_change_password',p.must_change_password,
              'email',u.email,
              'auth_disabled',u.disabled_at is not null,
              'membership_role',m.role,
              'membership_status',m.status,
              'membership_mfa_required',m.mfa_required,
              'teacher_id',t.id,
              'teacher_active',t.active,
              'teacher_deleted',t.deleted_at is not null,
              'password_credential_exists',pc.user_id is not null,
              'password_algorithm',pc.algorithm,
              'active_sessions',(select count(*) from authn.sessions s where s.user_id=p.id and s.revoked_at is null and s.expires_at>now())
            )::text
            from public.profiles p
            join authn.users u on u.id=p.id
            left join app.tenant_memberships m on m.user_id=p.id and m.tenant_id=current_setting('diag.tenant_id')::uuid
            left join public.teachers t on t.profile_id=p.id and t.deleted_at is null
            left join authn.password_credentials pc on pc.user_id=p.id
            where p.id=nullif(current_setting('diag.teacher_user_id'),'')::uuid
          ),'ABSENT');

          select 'LOOKUP_LOGIN '||coalesce((
            select jsonb_build_object(
              'user_id',x.user_id,
              'tenant_id',x.tenant_id,
              'tenant_code',x.tenant_code,
              'role',x.role,
              'status',x.status,
              'mfa_required',x.mfa_required,
              'disabled',x.disabled_at is not null,
              'password_hash_present',length(coalesce(x.password_hash,''))>0,
              'password_salt_present',length(coalesce(x.password_salt,''))>0
            )::text
            from authn.lookup_login(
              (select email from authn.users where id=nullif(current_setting('diag.teacher_user_id'),'')::uuid),
              (select code from app.tenants where id=current_setting('diag.tenant_id')::uuid)
            ) x
            limit 1
          ),'NO_ROW');

          select 'RECENT_AUTH_EVENTS '||coalesce(jsonb_agg(jsonb_build_object(
            'action',e.action,
            'actor_id',e.actor_id,
            'metadata',e.metadata,
            'occurred_at',e.occurred_at
          ) order by e.occurred_at desc),'[]'::jsonb)::text
          from (
            select *
            from audit.events
            where action like 'auth.login.%'
               or action='auth.login.failed'
            order by occurred_at desc
            limit 20
          ) e;

          select 'CLASS_TEACHER_SESSIONS '||coalesce(jsonb_agg(jsonb_build_object(
            'id',s.id,
            'role',s.role,
            'aal',s.assurance_level,
            'created_at',s.created_at,
            'expires_at',s.expires_at,
            'revoked_at',s.revoked_at
          ) order by s.created_at desc),'[]'::jsonb)::text
          from authn.sessions s
          where s.user_id=nullif(current_setting('diag.teacher_user_id'),'')::uuid;

          set local role edusentia_worker_runtime;
          select app.set_request_context(
            current_setting('diag.tenant_id')::uuid,
            nullif(current_setting('diag.teacher_user_id'),'')::uuid,
            'class_teacher',
            1::smallint
          );

          do $diag$
          declare
            uid uuid:=nullif(current_setting('diag.teacher_user_id'),'')::uuid;
            tid uuid:=current_setting('diag.tenant_id')::uuid;
            v jsonb;
            n integer;
          begin
            if uid is null then
              raise exception 'No active class teacher profile exists';
            end if;

            begin
              perform 1 from app.tenants t where t.id=tid;
              raise notice 'BOOTSTRAP_TENANT_OK';
            exception when others then
              raise notice 'BOOTSTRAP_TENANT_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              select (
                (select count(*) from app.students where tenant_id=tid and archived_at is null)
                +(select count(*) from app.staff where tenant_id=tid and archived_at is null)
                +(select count(*) from academics.classes where tenant_id=tid and archived_at is null)
                +(select count(*) from academics.subjects where tenant_id=tid and archived_at is null)
                +(select count(*) from academics.attendance_entries where tenant_id=tid and attendance_date=current_date)
                +(select count(*) from academics.student_reports where tenant_id=tid and status in ('draft','submitted','class_reviewed'))
              )::integer into n;
              raise notice 'BOOTSTRAP_METRICS_OK aggregate=%',n;
            exception when others then
              raise notice 'BOOTSTRAP_METRICS_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              perform 1
              from app.tenant_licenses tl
              left join platform.license_plans lp on lp.id=tl.plan_id
              where tl.tenant_id=tid
              limit 1;
              raise notice 'BOOTSTRAP_LICENSE_OK';
            exception when others then
              raise notice 'BOOTSTRAP_LICENSE_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              select count(*)::integer into n
              from app.role_permissions
              where role='class_teacher';
              raise notice 'BOOTSTRAP_PERMISSIONS_OK count=%',n;
            exception when others then
              raise notice 'BOOTSTRAP_PERMISSIONS_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              v:=public.get_bootstrap_data();
              raise notice 'BOOTSTRAP_CERTIFIED_OK keys=%',(
                select string_agg(key,',' order by key) from jsonb_object_keys(v) key
              );
            exception when others then
              raise notice 'BOOTSTRAP_CERTIFIED_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              v:=public.get_role_workspace();
              raise notice 'ROLE_WORKSPACE_OK linked=% classes=% subjects=%',
                coalesce((v->>'linked')::boolean,true),
                jsonb_array_length(coalesce(v->'classes','[]'::jsonb)),
                jsonb_array_length(coalesce(v->'subjects','[]'::jsonb));
            exception when others then
              raise notice 'ROLE_WORKSPACE_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              insert into authn.sessions(id,user_id,tenant_id,token_hash,role,assurance_level,expires_at)
              values(gen_random_uuid(),uid,tid,repeat('0',64),'class_teacher',1,now()+interval '5 minutes');
              raise notice 'SESSION_ISSUE_OK';
            exception when others then
              raise notice 'SESSION_ISSUE_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;
          end
          $diag$;

          rollback;
          SQL
