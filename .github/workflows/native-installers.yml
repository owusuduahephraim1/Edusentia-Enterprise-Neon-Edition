name: Build Neon Native Installers
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-installers.yml'
permissions:
  contents: read
jobs:
  windows:
    name: Windows MSI and EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '20'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Test adaptive Windows shell
        working-directory: native/windows/src-tauri
        run: cargo test --lib
      - name: Build MSI and NSIS EXE
        working-directory: native/windows
        run: npm install && npm run build
      - name: Stage Windows installers
        shell: pwsh
        run: |
          $msi = Get-ChildItem native/windows/src-tauri/target/release/bundle/msi -Filter *.msi -File | Select-Object -First 1
          $exe = Get-ChildItem native/windows/src-tauri/target/release/bundle/nsis -Filter *.exe -File | Select-Object -First 1
          if (!$msi -or !$exe) { throw "Expected MSI and EXE installers were not produced." }
          New-Item -ItemType Directory -Force release-assets/windows | Out-Null
          Copy-Item $msi.FullName release-assets/windows/Edusentia-Enterprise-Neon-Windows-x64.msi
          Copy-Item $exe.FullName release-assets/windows/Edusentia-Enterprise-Neon-Setup-x64.exe
          $items = Get-ChildItem release-assets/windows -File
          $lines = foreach ($item in $items) {
            $hash=(Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          $lines | Set-Content -Encoding ascii release-assets/windows/SHA256SUMS-WINDOWS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: edusentia-neon-windows-installers
          if-no-files-found: error
          path: release-assets/windows/*

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.EDUSENTIA_NEON_ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EDUSENTIA_NEON_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.EDUSENTIA_NEON_ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.EDUSENTIA_NEON_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build installable APK
        shell: bash
        working-directory: native/android
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/edusentia-neon-release.jks"
            export EDUSENTIA_NEON_ANDROID_KEYSTORE="$RUNNER_TEMP/edusentia-neon-release.jks"
            export EDUSENTIA_NEON_ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export EDUSENTIA_NEON_ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS"
            export EDUSENTIA_NEON_ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            gradle :app:assembleRelease
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "Production signing secrets are not configured; building an installable debug-signed APK."
            gradle :app:assembleDebug
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
          fi
      - name: Stage and verify Android APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APK_VARIANT" = release ]; then
            APK=$(find native/android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          else
            APK=$(find native/android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          fi
          test -n "$APK" && test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release-assets/android
          cp "$APK" release-assets/android/Edusentia-Enterprise-Neon-Android.apk
          printf '%s\n' "$APK_VARIANT" > release-assets/android/BUILD-VARIANT.txt
          (cd release-assets/android && sha256sum Edusentia-Enterprise-Neon-Android.apk > SHA256SUMS-ANDROID.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: edusentia-neon-android-apk
          if-no-files-found: error
          path: release-assets/android/*
