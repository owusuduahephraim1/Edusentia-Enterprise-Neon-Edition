name: Live Backup Smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backup-live-smoke.yml"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
      SESSION_PEPPER_VALUE: ${{ secrets.SESSION_PEPPER || secrets.AUTH_SECRET }}
      WORKER_URL: https://edusentia-enterprise-neon-api.edusentia-enterprise-neon.workers.dev
    steps:
      - name: Install PostgreSQL client
        run: |
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      - name: Create one-time MFA session and run real backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_DATABASE_URL"
          test -n "$SESSION_PEPPER_VALUE"

          MASTER_URL="$(SOURCE_DATABASE_URL="$SOURCE_DATABASE_URL" node --input-type=module -e 'const u=new URL(process.env.SOURCE_DATABASE_URL);u.pathname="/edusentia";process.stdout.write(u.toString())')"
          echo "::add-mask::$MASTER_URL"

          ROUTE="$(psql "$MASTER_URL" -X -qAtF '|' -c "select tenant_id,tenant_code,database_name from platform.tenant_control where lower(school_name) like '%nipe%international%school%' and database_state='isolated_ready' order by created_at desc limit 1")"
          test -n "$ROUTE"
          IFS='|' read -r TENANT_ID TENANT_CODE DB_NAME <<< "$ROUTE"

          TENANT_URL="$(MASTER_URL="$MASTER_URL" DB_NAME="$DB_NAME" node --input-type=module -e 'const u=new URL(process.env.MASTER_URL);u.pathname="/"+process.env.DB_NAME;process.stdout.write(u.toString())')"
          echo "::add-mask::$TENANT_URL"

          ADMIN_USER_ID="$(psql "$TENANT_URL" -X -qAtc "select m.user_id from app.tenant_memberships m join authn.users u on u.id=m.user_id where m.tenant_id='$TENANT_ID'::uuid and m.role='system_admin' and m.status='active' and u.disabled_at is null order by m.created_at limit 1")"
          test -n "$ADMIN_USER_ID"

          OPAQUE="$(openssl rand -hex 32)"
          TOKEN="$TENANT_CODE.$OPAQUE"
          export TOKEN
          echo "::add-mask::$TOKEN"

          TOKEN_HASH="$(node --input-type=module -e 'import crypto from "node:crypto"; process.stdout.write(crypto.createHash("sha256").update(process.env.TOKEN+"."+process.env.SESSION_PEPPER_VALUE).digest("hex"))')"
          echo "::add-mask::$TOKEN_HASH"
          SESSION_ID="$(cat /proc/sys/kernel/random/uuid)"

          cleanup() {
            psql "$TENANT_URL" -X -qAtc "delete from authn.sessions where id='$SESSION_ID'::uuid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          psql "$TENANT_URL" -X -v ON_ERROR_STOP=1 -qAtc "insert into authn.sessions(id,user_id,tenant_id,token_hash,role,assurance_level,expires_at) values('$SESSION_ID'::uuid,'$ADMIN_USER_ID'::uuid,'$TENANT_ID'::uuid,'$TOKEN_HASH','system_admin',2,now()+interval '20 minutes')"

          HTTP_CODE="$(curl -sS --max-time 600 -o /tmp/backup-response.json -w '%{http_code}'             -H 'content-type: application/json'             -H 'origin: https://owusuduahephraim1.github.io'             -H "cookie: __Host-edusentia_session=$TOKEN"             --data '{"action":"backup_now"}'             "$WORKER_URL/api/compat/functions/scheduled-backup")"

          export HTTP_CODE
          node --input-type=module -e '
            import fs from "node:fs";
            const raw=fs.readFileSync("/tmp/backup-response.json","utf8");
            let body={}; try{ body=JSON.parse(raw); }catch{}
            console.log("Backup API status:",process.env.HTTP_CODE); console.log("Backup response body:",raw.slice(0,1200));
            console.log("Backup result:",JSON.stringify({
              id:body.id||null,
              status:body.status||null,
              verification_status:body.verification_status||null,
              ready:body.ready===true,
              code:body.code||null,
              message:body.message||null
            }));
            if(Number(process.env.HTTP_CODE)!==200 || body.ready!==true || !body.id) process.exit(1);
            fs.writeFileSync("/tmp/backup-id",String(body.id));
          '

          BACKUP_ID="$(cat /tmp/backup-id)"
          RESULT="$(psql "$TENANT_URL" -X -qAtF '|' -c "select status,verification_status,coalesce(manifest_path,''),coalesce(database_path,'') from public.backup_exports where id='$BACKUP_ID'::uuid")"
          IFS='|' read -r STATUS VERIFY MANIFEST DATABASE <<< "$RESULT"
          echo "Persisted backup status: $STATUS"
          echo "Persisted verification: $VERIFY"
          test "$STATUS" = "completed"
          test "$VERIFY" = "passed"
          test -n "$MANIFEST"
          test -n "$DATABASE"

          echo "Live full-school backup completed and verified successfully."
