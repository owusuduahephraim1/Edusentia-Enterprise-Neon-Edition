# final release revalidation: hardened-direct-role-deploy
# release revalidation: direct-role-isolated parity deploy
# deployment retry after parity credential isolation contract passed
name: Deploy Parity Browser Test

on:
  push:
    branches: [reference-parity-r42]
    paths:
      - "frontend/**"
      - "worker/**"
      - ".github/workflows/deploy-parity-test.yml"
      - "scripts/parity-authenticated-e2e.mjs"
      - "tests/contracts.test.mjs"
      - "database/provisioner-role.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edusentia-parity-browser-test
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PARITY_WORKER_DATABASE_URL: ${{ secrets.PARITY_WORKER_DATABASE_URL }}
  PARITY_PROVISIONER_DATABASE_URL: ${{ secrets.PARITY_PROVISIONER_DATABASE_URL }}
  BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
  SESSION_PEPPER_VALUE: ${{ secrets.SESSION_PEPPER || secrets.AUTH_SECRET }}
  BOOTSTRAP_ADMIN_SECRET_VALUE: ${{ secrets.BOOTSTRAP_ADMIN_SECRET }}
  PARITY_DATABASE_HOST: ep-shy-meadow-b5e4d9e4.c-7.us-east-2.aws.neon.tech
  PARITY_ORIGIN: https://edusentia-enterprise-neon-parity-test.edusentia-enterprise-neon.workers.dev

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Full quality gate
        run: |
          npm run check
          npm test

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - id: config
        name: Resolve isolated parity test and deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test_ready=true
          deploy_ready=true

          [ -n "$BOOTSTRAP_DATABASE_URL" ] || { echo "::error::Missing NEON_DATABASE_URL or DATABASE_URL"; test_ready=false; deploy_ready=false; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || deploy_ready=false
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || deploy_ready=false
          [ -n "$PARITY_WORKER_DATABASE_URL" ] || deploy_ready=false
          [ -n "$PARITY_PROVISIONER_DATABASE_URL" ] || deploy_ready=false
          [ -n "$SESSION_PEPPER_VALUE" ] || deploy_ready=false
          [ -n "$BOOTSTRAP_ADMIN_SECRET_VALUE" ] || deploy_ready=false

          if [ "$test_ready" = true ]; then
            PARITY_BOOTSTRAP_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" PARITY_DATABASE_HOST="$PARITY_DATABASE_HOST" node --input-type=module -e '
              const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);
              u.hostname=process.env.PARITY_DATABASE_HOST;
              u.pathname="/edusentia";
              process.stdout.write(u.toString());
            ')"
            echo "::add-mask::$PARITY_BOOTSTRAP_URL"
            echo "PARITY_BOOTSTRAP_URL=$PARITY_BOOTSTRAP_URL" >> "$GITHUB_ENV"
          fi

          echo "test_ready=$test_ready" >> "$GITHUB_OUTPUT"
          echo "deploy_ready=$deploy_ready" >> "$GITHUB_OUTPUT"
          if [ "$test_ready" != true ]; then
            exit 1
          fi
          if [ "$deploy_ready" != true ]; then
            echo "Dedicated parity deployment credentials are incomplete; reusing the already deployed isolated parity Worker for authenticated release testing."
          fi

      - name: Verify isolated parity bootstrap route
        if: steps.config.outputs.test_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const u=new URL(process.env.PARITY_BOOTSTRAP_URL);
            if(u.hostname!==process.env.PARITY_DATABASE_HOST) throw new Error("Parity bootstrap URL does not target the non-primary parity endpoint");
            if(u.pathname!=="/edusentia") throw new Error("Parity bootstrap URL must target the edusentia control database");
            console.log("Parity bootstrap route structure verified.");
          '
          PARITY_DB_NAME="$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select current_database()")"
          PARITY_DB_ROLE="$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select current_user")"
          test "$PARITY_DB_NAME" = "edusentia"
          echo "Parity bootstrap endpoint verified; deployment role is $PARITY_DB_ROLE."

      - name: Verify isolated parity Worker and provisioner credentials
        if: steps.config.outputs.deploy_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::$PARITY_WORKER_DATABASE_URL"
          echo "::add-mask::$PARITY_PROVISIONER_DATABASE_URL"
          test "$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select session_user||'|'||current_user||'|'||current_setting('role')")" = "edusentia_runtime|edusentia_runtime|none"
          test "$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select pg_has_role('edusentia_runtime','edusentia_worker_runtime','set') and pg_has_role('edusentia_runtime','edusentia_provisioner','set')")" = "t"
          echo "Deployment runtime retains SET-only access; service-role credentials are managed outside CI."

      - name: Verify dedicated parity database URL
        if: steps.config.outputs.deploy_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const u=new URL(process.env.PARITY_WORKER_DATABASE_URL);
            if(u.hostname!==process.env.PARITY_DATABASE_HOST) throw new Error("Parity database URL does not target the non-primary parity endpoint");
            if(u.pathname!=="/edusentia") throw new Error("Parity database URL must target the edusentia control database");
            if(u.username!=="edusentia_worker_runtime") throw new Error("Parity database URL must use the least-privilege Worker role");
            console.log("Dedicated parity Worker database route structure verified.");
          '
          node --input-type=module -e '
            const u=new URL(process.env.PARITY_PROVISIONER_DATABASE_URL);
            if(u.hostname!==process.env.PARITY_DATABASE_HOST) throw new Error("Parity provisioner URL does not target the non-primary parity endpoint");
            if(u.pathname!=="/edusentia") throw new Error("Parity provisioner URL must target the edusentia control database");
            if(u.username!=="edusentia_provisioner") throw new Error("Parity provisioner URL must use the dedicated provisioner role");
          '
          (
            cd worker
            node --input-type=module -e '
              import { neon } from "@neondatabase/serverless";
              const worker=neon(process.env.PARITY_WORKER_DATABASE_URL);
              const provisioner=neon(process.env.PARITY_PROVISIONER_DATABASE_URL);
              const [wr,pr]=await Promise.all([
                worker`select current_user role, current_database() database`,
                provisioner`select current_user role, current_database() database, r.rolcreatedb, r.rolsuper, r.rolcreaterole, r.rolbypassrls from pg_roles r where r.rolname=current_user`
              ]);
              if(wr[0]?.role!=="edusentia_worker_runtime"||wr[0]?.database!=="edusentia")throw new Error("Parity least-privilege database identity verification failed");
              if(pr[0]?.role!=="edusentia_provisioner"||pr[0]?.database!=="edusentia"||!pr[0]?.rolcreatedb||pr[0]?.rolsuper||pr[0]?.rolcreaterole||pr[0]?.rolbypassrls)throw new Error("Parity provisioner database identity verification failed");
              console.log("Dedicated parity Worker and provisioner database identities verified.");
            '
          )

      - name: Stage parity frontend configuration
        if: steps.config.outputs.deploy_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > frontend/config.js <<'EOF'
          window.EDS_MASTER_CONFIG = Object.freeze({
            apiBaseUrl: "https://edusentia-enterprise-neon-parity-test.edusentia-enterprise-neon.workers.dev",
            productName: "Edusentia Enterprise Neon Edition",
            productVersion: "neon-v1.0.0-r42-parity-test",
            repositoryBasePath: "/",
            turnstileSiteKey: "1x00000000000000000000AA",
            environment: "parity-testing"
          });
          EOF
          test -f frontend/assets/edusentia-auth-learning.webp
          echo "916a25b9c34991f05318ab2f7306cf854adb6b03ca6d4416bb16ce90f0976de1  frontend/assets/edusentia-auth-learning.webp" | sha256sum --check --status

      - name: Ensure isolated parity R2 bucket
        if: steps.config.outputs.deploy_ready == 'true'
        working-directory: worker
        run: |
          if npx wrangler r2 bucket info edusentia-enterprise-neon-parity-test --json >/dev/null 2>&1; then
            echo "Parity R2 bucket already exists."
          else
            npx wrangler r2 bucket create edusentia-enterprise-neon-parity-test
          fi

      - name: Create parity Worker deployment shell
        if: steps.config.outputs.deploy_ready == 'true'
        working-directory: worker
        run: npx wrangler deploy --config wrangler.parity.jsonc

      - name: Install parity Worker secrets
        if: steps.config.outputs.deploy_ready == 'true'
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PARITY_WORKER_DATABASE_URL" | npx wrangler secret put DATABASE_URL --config wrangler.parity.jsonc
          printf '%s' "$PARITY_PROVISIONER_DATABASE_URL" | npx wrangler secret put PROVISIONER_DATABASE_URL --config wrangler.parity.jsonc
          printf '%s' "$SESSION_PEPPER_VALUE" | npx wrangler secret put SESSION_PEPPER --config wrangler.parity.jsonc
          printf '%s' "$BOOTSTRAP_ADMIN_SECRET_VALUE" | npx wrangler secret put BOOTSTRAP_ADMIN_SECRET --config wrangler.parity.jsonc

      - name: Final deploy and parity smoke
        if: steps.config.outputs.deploy_ready == 'true'
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.parity.jsonc
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PARITY_ORIGIN/api/health" | tee /tmp/parity-health.json
          node -e 'const fs=require("node:fs");const h=JSON.parse(fs.readFileSync("/tmp/parity-health.json","utf8"));if(!h.ok||!h.database||!h.storage)process.exit(1);console.log("Parity Worker health passed.")'
          curl --fail --silent --show-error --retry 5 "$PARITY_ORIGIN/" | grep -q "Edusentia Enterprise"
          curl --fail --silent --show-error --retry 5 "$PARITY_ORIGIN/config.js" | grep -q "parity-testing"
          echo "Parity browser test environment is live at $PARITY_ORIGIN"

      - name: Verify existing isolated parity deployment
        if: steps.config.outputs.test_ready == 'true' && steps.config.outputs.deploy_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PARITY_ORIGIN/api/health" | tee /tmp/parity-health.json
          node -e 'const fs=require("node:fs");const h=JSON.parse(fs.readFileSync("/tmp/parity-health.json","utf8"));if(!h.ok||!h.database||!h.storage)process.exit(1);console.log("Existing parity Worker health passed.")'
          curl --fail --silent --show-error --retry 5 "$PARITY_ORIGIN/" | grep -q "Edusentia Enterprise"
          curl --fail --silent --show-error --retry 5 "$PARITY_ORIGIN/config.js" | grep -q "parity-testing"
          echo "Existing isolated parity deployment verified at $PARITY_ORIGIN"

      - name: Run authenticated parity end-to-end gate
        if: steps.config.outputs.test_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for attempt in 1 2 3; do
            echo "Authenticated parity E2E attempt $attempt of 3"
            if node scripts/parity-authenticated-e2e.mjs | tee /tmp/parity-authenticated-e2e.json; then
              passed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
            fi
          done
          [ "$passed" = true ]
          node -e 'const fs=require("node:fs");const lines=fs.readFileSync("/tmp/parity-authenticated-e2e.json","utf8").trim().split(/\n/);const r=JSON.parse(lines.at(-1));if(!r.ok||r.assuranceLevel!==2||!r.r2RoundTrip)process.exit(1);console.log("Authenticated parity E2E passed across "+r.modules.length+" module surfaces.")'
