# final production candidate gate: r42-20260921-v3
# final production candidate gate: r42-20260921-v2
# final production candidate gate: r42-20260921
# final release revalidation: hardened-direct-role-deploy
# release revalidation: direct-role-isolated parity deploy
# deployment retry after parity credential isolation contract passed
name: Deploy Parity Browser Test

on:
  push:
    branches: [reference-parity-r42]
    paths:
      - "frontend/**"
      - "worker/**"
      - ".github/workflows/deploy-parity-test.yml"
      - "scripts/parity-authenticated-e2e.mjs"
      - "tests/contracts.test.mjs"
      - "database/provisioner-role.sql"
      - "database/service-login-roles.sql"
      - "database/reference-compat/**"
      - "database/tenant-template/**"
      - "scripts/reference-surface-inventory.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edusentia-parity-template-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
  SESSION_PEPPER_VALUE: ${{ secrets.SESSION_PEPPER || secrets.AUTH_SECRET }}
  BOOTSTRAP_ADMIN_SECRET_VALUE: ${{ secrets.BOOTSTRAP_ADMIN_SECRET }}
  PARITY_DATABASE_HOST: ep-shy-meadow-b5e4d9e4.c-7.us-east-2.aws.neon.tech
  PARITY_POOLER_DATABASE_HOST: ep-shy-meadow-b5e4d9e4-pooler.c-7.us-east-2.aws.neon.tech
  PARITY_ORIGIN: https://edusentia-enterprise-neon-parity-test.edusentia-enterprise-neon.workers.dev

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Full quality gate
        run: |
          npm run check
          npm test

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - id: config
        name: Resolve isolated parity test and deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test_ready=true
          code_deploy_ready=true
          secret_refresh_ready=true

          [ -n "$BOOTSTRAP_DATABASE_URL" ] || { echo "::error::Missing NEON_DATABASE_URL or DATABASE_URL"; test_ready=false; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { code_deploy_ready=false; secret_refresh_ready=false; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { code_deploy_ready=false; secret_refresh_ready=false; }
          [ -n "$SESSION_PEPPER_VALUE" ] || secret_refresh_ready=false
          [ -n "$BOOTSTRAP_ADMIN_SECRET_VALUE" ] || secret_refresh_ready=false

          if [ "$test_ready" = true ]; then
            PARITY_BOOTSTRAP_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" PARITY_DATABASE_HOST="$PARITY_DATABASE_HOST" node --input-type=module -e '
              const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);
              u.hostname=process.env.PARITY_DATABASE_HOST;
              u.pathname="/edusentia";
              process.stdout.write(u.toString());
            ')"
            echo "::add-mask::$PARITY_BOOTSTRAP_URL"
            echo "PARITY_BOOTSTRAP_URL=$PARITY_BOOTSTRAP_URL" >> "$GITHUB_ENV"
          fi

          echo "test_ready=$test_ready" >> "$GITHUB_OUTPUT"
          echo "code_deploy_ready=$code_deploy_ready" >> "$GITHUB_OUTPUT"
          echo "secret_refresh_ready=$secret_refresh_ready" >> "$GITHUB_OUTPUT"
          if [ "$test_ready" != true ]; then
            exit 1
          fi
          if [ "$code_deploy_ready" = true ] && [ "$secret_refresh_ready" != true ]; then
            echo "Deploying current parity code while preserving the Worker's existing encrypted secrets."
          elif [ "$code_deploy_ready" != true ]; then
            echo "Cloudflare deployment credentials are unavailable; verifying the existing isolated parity Worker instead."
          fi

      - name: Verify isolated parity bootstrap route
        if: steps.config.outputs.test_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const u=new URL(process.env.PARITY_BOOTSTRAP_URL);
            if(u.hostname!==process.env.PARITY_DATABASE_HOST) throw new Error("Parity bootstrap URL does not target the non-primary parity endpoint");
            if(u.pathname!=="/edusentia") throw new Error("Parity bootstrap URL must target the edusentia control database");
            console.log("Parity bootstrap route structure verified.");
          '
          PARITY_DB_NAME="$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select current_database()")"
          PARITY_DB_ROLE="$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select current_user")"
          test "$PARITY_DB_NAME" = "edusentia"
          echo "Parity bootstrap endpoint verified; deployment role is $PARITY_DB_ROLE."

      - name: Prepare rotatable parity service credentials
        if: steps.config.outputs.secret_refresh_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select current_user")" = "edusentia_runtime"
          test "$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select count(*)=2 from pg_auth_members m join pg_roles granted on granted.oid=m.roleid join pg_roles member_role on member_role.oid=m.member where member_role.rolname='edusentia_runtime' and granted.rolname in('edusentia_worker_login','edusentia_provisioner_login') and m.admin_option and not m.inherit_option and not m.set_option")" = "t"

          WORKER_LOGIN_PASSWORD="$(openssl rand -hex 32)"
          PROVISIONER_LOGIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$WORKER_LOGIN_PASSWORD"
          echo "::add-mask::$PROVISIONER_LOGIN_PASSWORD"

          psql "$PARITY_BOOTSTRAP_URL" -v ON_ERROR_STOP=1 -c "alter role edusentia_worker_login login password '$WORKER_LOGIN_PASSWORD'; alter role edusentia_provisioner_login login password '$PROVISIONER_LOGIN_PASSWORD';"

          PARITY_WORKER_DATABASE_URL="$(PARITY_BOOTSTRAP_URL="$PARITY_BOOTSTRAP_URL" PARITY_POOLER_DATABASE_HOST="$PARITY_POOLER_DATABASE_HOST" WORKER_LOGIN_PASSWORD="$WORKER_LOGIN_PASSWORD" node --input-type=module -e '
            const u=new URL(process.env.PARITY_BOOTSTRAP_URL);
            u.hostname=process.env.PARITY_POOLER_DATABASE_HOST;
            u.username="edusentia_worker_login";
            u.password=process.env.WORKER_LOGIN_PASSWORD;
            process.stdout.write(u.toString());
          ')"
          PARITY_PROVISIONER_DATABASE_URL="$(PARITY_BOOTSTRAP_URL="$PARITY_BOOTSTRAP_URL" PROVISIONER_LOGIN_PASSWORD="$PROVISIONER_LOGIN_PASSWORD" node --input-type=module -e '
            const u=new URL(process.env.PARITY_BOOTSTRAP_URL);
            u.username="edusentia_provisioner_login";
            u.password=process.env.PROVISIONER_LOGIN_PASSWORD;
            process.stdout.write(u.toString());
          ')"

          echo "::add-mask::$PARITY_WORKER_DATABASE_URL"
          echo "::add-mask::$PARITY_PROVISIONER_DATABASE_URL"
          echo "PARITY_WORKER_DATABASE_URL=$PARITY_WORKER_DATABASE_URL" >> "$GITHUB_ENV"
          echo "PARITY_PROVISIONER_DATABASE_URL=$PARITY_PROVISIONER_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Verify isolated parity Worker and provisioner credentials
        if: steps.config.outputs.secret_refresh_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::$PARITY_WORKER_DATABASE_URL"
          echo "::add-mask::$PARITY_PROVISIONER_DATABASE_URL"
          test "$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select session_user||'|'||current_user||'|'||current_setting('role')")" = "edusentia_runtime|edusentia_runtime|none"
          test "$(psql "$PARITY_BOOTSTRAP_URL" -Atc "select pg_has_role('edusentia_worker_login','edusentia_worker_runtime','set') and pg_has_role('edusentia_provisioner_login','edusentia_provisioner','set')")" = "t"
          echo "Rotatable login wrappers preserve SET-only access to fixed service roles."

      - name: Verify dedicated parity database URL
        if: steps.config.outputs.secret_refresh_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const u=new URL(process.env.PARITY_WORKER_DATABASE_URL);
            if(u.hostname!==process.env.PARITY_POOLER_DATABASE_HOST) throw new Error("Parity Worker URL must target the pooled non-primary parity endpoint");
            if(u.pathname!=="/edusentia") throw new Error("Parity Worker URL must target the edusentia control database");
            if(u.username!=="edusentia_worker_login") throw new Error("Parity Worker URL must use the rotatable Worker login wrapper");
            console.log("Dedicated parity Worker database route structure verified.");
          '
          node --input-type=module -e '
            const u=new URL(process.env.PARITY_PROVISIONER_DATABASE_URL);
            if(u.hostname!==process.env.PARITY_DATABASE_HOST) throw new Error("Parity provisioner URL does not target the direct non-primary parity endpoint");
            if(u.pathname!=="/edusentia") throw new Error("Parity provisioner URL must target the edusentia control database");
            if(u.username!=="edusentia_provisioner_login") throw new Error("Parity provisioner URL must use the rotatable provisioner login wrapper");
          '
          (
            cd worker
            node --input-type=module -e '
              import { neon } from "@neondatabase/serverless";
              const worker=neon(process.env.PARITY_WORKER_DATABASE_URL);
              const provisioner=neon(process.env.PARITY_PROVISIONER_DATABASE_URL);
              const [wr,pr]=await Promise.all([
                worker`select session_user session_role,current_user role,current_database() database, pg_has_role(current_user,${"edusentia_worker_runtime"}::text,${"member"}::text) inherited_runtime`,
                provisioner`select session_user session_role,current_user role,current_database() database, r.rolcreatedb, r.rolsuper, r.rolcreaterole, r.rolbypassrls, pg_has_role(current_user,${"edusentia_provisioner"}::text,${"member"}::text) inherited_provisioner from pg_roles r where r.rolname=current_user`
              ]);
              if(wr[0]?.session_role!=="edusentia_worker_login"||wr[0]?.role!=="edusentia_worker_login"||wr[0]?.database!=="edusentia"||!wr[0]?.inherited_runtime)throw new Error("Parity least-privilege database identity verification failed");
              if(pr[0]?.session_role!=="edusentia_provisioner_login"||pr[0]?.role!=="edusentia_provisioner_login"||pr[0]?.database!=="edusentia"||!pr[0]?.rolcreatedb||pr[0]?.rolsuper||pr[0]?.rolcreaterole||pr[0]?.rolbypassrls||!pr[0]?.inherited_provisioner)throw new Error("Parity provisioner database identity verification failed");
              console.log("Dedicated parity Worker and provisioner database identities verified.");
            '
          )

      - name: Inventory certified reference RPC surface on live tenant
        if: steps.config.outputs.secret_refresh_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reference-surface-inventory.mjs | tee /tmp/reference-surface-inventory.json
          node - <<'NODE'
          const fs=require("node:fs");
          const r=JSON.parse(fs.readFileSync("/tmp/reference-surface-inventory.json","utf8").trim().split(/\n/).at(-1));
          if(r.referenceRpcCount!==172||r.installedReferenceRpcCount!==172||r.executableReferenceRpcCount!==172||r.missingCount!==0||r.blockedCount!==0){
            console.error(r);
            process.exit(1);
          }
          console.log("Live parity reference RPC inventory verified: 172/172 executable.");
          NODE

      - name: Verify provisioner wrapper can create and remove an isolated database
        if: steps.config.outputs.secret_refresh_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PROBE_DB="edusentia_wrapper_probe_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          PROBE_DB="${PROBE_DB//-/_}"
          PROBE_DB="${PROBE_DB:0:60}"
          cleanup_probe(){
            psql "$PARITY_PROVISIONER_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop database if exists \"$PROBE_DB\" with (force)" >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT
          cleanup_probe
          psql "$PARITY_PROVISIONER_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database \"$PROBE_DB\" template edusentia_tenant_template"
          test "$(psql "$PARITY_PROVISIONER_DATABASE_URL" -Atc "select pg_get_userbyid(datdba) from pg_database where datname='$PROBE_DB'")" = "edusentia_provisioner_login"
          cleanup_probe
          trap - EXIT
          echo "Rotatable provisioner login wrapper can create and remove isolated tenant databases."

      - name: Stage parity frontend configuration
        if: steps.config.outputs.code_deploy_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > frontend/config.js <<'EOF'
          window.EDS_MASTER_CONFIG = Object.freeze({
            apiBaseUrl: "https://edusentia-enterprise-neon-parity-test.edusentia-enterprise-neon.workers.dev",
            productName: "Edusentia Enterprise Neon Edition",
            productVersion: "neon-v1.0.0-r42-parity-test",
            repositoryBasePath: "/",
            turnstileSiteKey: "1x00000000000000000000AA",
            environment: "parity-testing"
          });
          EOF
          test -f frontend/assets/edusentia-auth-learning.webp
          echo "916a25b9c34991f05318ab2f7306cf854adb6b03ca6d4416bb16ce90f0976de1  frontend/assets/edusentia-auth-learning.webp" | sha256sum --check --status

      - name: Ensure isolated parity R2 bucket
        if: steps.config.outputs.code_deploy_ready == 'true'
        working-directory: worker
        run: |
          if npx wrangler r2 bucket info edusentia-enterprise-neon-parity-test --json >/dev/null 2>&1; then
            echo "Parity R2 bucket already exists."
          else
            npx wrangler r2 bucket create edusentia-enterprise-neon-parity-test
          fi

      - name: Create parity Worker deployment shell
        if: steps.config.outputs.code_deploy_ready == 'true'
        working-directory: worker
        run: npx wrangler deploy --config wrangler.parity.jsonc

      - name: Install parity Worker secrets
        if: steps.config.outputs.secret_refresh_ready == 'true'
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PARITY_WORKER_DATABASE_URL" | npx wrangler secret put DATABASE_URL --config wrangler.parity.jsonc
          printf '%s' "$PARITY_PROVISIONER_DATABASE_URL" | npx wrangler secret put PROVISIONER_DATABASE_URL --config wrangler.parity.jsonc
          printf '%s' "$SESSION_PEPPER_VALUE" | npx wrangler secret put SESSION_PEPPER --config wrangler.parity.jsonc
          printf '%s' "$BOOTSTRAP_ADMIN_SECRET_VALUE" | npx wrangler secret put BOOTSTRAP_ADMIN_SECRET --config wrangler.parity.jsonc

      - name: Final deploy and parity smoke
        if: steps.config.outputs.code_deploy_ready == 'true'
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.parity.jsonc
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PARITY_ORIGIN/api/health" | tee /tmp/parity-health.json
          node -e 'const fs=require("node:fs");const h=JSON.parse(fs.readFileSync("/tmp/parity-health.json","utf8"));if(!h.ok||!h.database||!h.storage)process.exit(1);console.log("Parity Worker health passed.")'
          curl --fail --silent --show-error --retry 5 "$PARITY_ORIGIN/" -o /tmp/parity-index.html
          grep -q "Edusentia Enterprise" /tmp/parity-index.html
          curl --fail --silent --show-error --retry 5 "$PARITY_ORIGIN/config.js" -o /tmp/parity-config.js
          grep -q "parity-testing" /tmp/parity-config.js
          echo "Parity browser test environment is live at $PARITY_ORIGIN"

      - name: Verify existing isolated parity deployment
        if: steps.config.outputs.test_ready == 'true' && steps.config.outputs.code_deploy_ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PARITY_ORIGIN/api/health" | tee /tmp/parity-health.json
          node -e 'const fs=require("node:fs");const h=JSON.parse(fs.readFileSync("/tmp/parity-health.json","utf8"));if(!h.ok||!h.database||!h.storage)process.exit(1);console.log("Existing parity Worker health passed.")'
          curl --fail --silent --show-error --retry 5 "$PARITY_ORIGIN/" -o /tmp/parity-index.html
          grep -q "Edusentia Enterprise" /tmp/parity-index.html
          curl --fail --silent --show-error --retry 5 "$PARITY_ORIGIN/config.js" -o /tmp/parity-config.js
          grep -q "parity-testing" /tmp/parity-config.js
          echo "Existing isolated parity deployment verified at $PARITY_ORIGIN"

      - name: Run authenticated parity end-to-end gate
        if: steps.config.outputs.test_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for attempt in 1 2 3; do
            echo "Authenticated parity E2E attempt $attempt of 3"
            if node scripts/parity-authenticated-e2e.mjs | tee /tmp/parity-authenticated-e2e.json; then
              passed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
            fi
          done
          [ "$passed" = true ]
          node -e 'const fs=require("node:fs");const lines=fs.readFileSync("/tmp/parity-authenticated-e2e.json","utf8").trim().split(/\n/);const r=JSON.parse(lines.at(-1));if(!r.ok||r.assuranceLevel!==2||!r.r2RoundTrip)process.exit(1);console.log("Authenticated parity E2E passed across "+r.modules.length+" module surfaces.")'
