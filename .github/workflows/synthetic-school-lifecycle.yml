name: Synthetic School Lifecycle Smoke

on:
  push:
    branches: [main, reference-parity-r42]
    paths:
      - "database/migrations/**"
      - "database/tenant-template/**"
      - "database/reference-compat/**"
      - "database/synthetic-school-lifecycle-smoke.sh"
      - "worker/src/provisioning.ts"
      - "worker/src/tenant-release.ts"
      - ".github/workflows/synthetic-school-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-school-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-and-shs:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Require deployment database credential
        run: |
          test -n "$BOOTSTRAP_DATABASE_URL" || { echo "DATABASE_URL/NEON_DATABASE_URL is required for lifecycle smoke tests."; exit 1; }

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Route parity smoke to non-primary Neon branch
        if: github.ref == 'refs/heads/reference-parity-r42'
        shell: bash
        env:
          PARITY_DATABASE_HOST: ep-shy-meadow-b5e4d9e4-pooler.c-7.us-east-2.aws.neon.tech
        run: |
          set -euo pipefail
          PARITY_DATABASE_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" PARITY_DATABASE_HOST="$PARITY_DATABASE_HOST" node --input-type=module -e '
            const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);
            u.hostname=process.env.PARITY_DATABASE_HOST;
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$PARITY_DATABASE_URL"
          echo "BOOTSTRAP_DATABASE_URL=$PARITY_DATABASE_URL" >> "$GITHUB_ENV"
          echo "CI_TEMPLATE_DATABASE=edusentia_ci_base" >> "$GITHUB_ENV"
          PARITY_DB_NAME="$(psql "$PARITY_DATABASE_URL" -Atc "select current_database()")"
          PARITY_DB_ROLE="$(psql "$PARITY_DATABASE_URL" -Atc "select current_user")"
          test "$PARITY_DB_NAME" = "edusentia"
          echo "Parity Neon endpoint verified; deployment role is $PARITY_DB_ROLE."

      - name: Run synthetic Basic/JHS and Senior High lifecycle
        run: bash database/synthetic-school-lifecycle-smoke.sh
