name: Teacher Photo Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/teacher-photo-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Inspect teacher photo contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOOTSTRAP_DATABASE_URL"
          ADMIN_DATABASE_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          TENANT_DATABASE_URL="$(ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.ADMIN_DATABASE_URL);
            u.pathname="/edusentia_nis_000001";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$ADMIN_DATABASE_URL"
          echo "::add-mask::$TENANT_DATABASE_URL"
          echo "=== set_teacher_photo definition ==="
          psql "$TENANT_DATABASE_URL" -Atc "select pg_get_functiondef('public.set_teacher_photo(uuid,text,timestamptz)'::regprocedure);"
          echo "=== target teacher ==="
          psql "$TENANT_DATABASE_URL" -At -F '|' -c "select id::text,staff_no::text,coalesce(photo_url,''),updated_at from public.teachers where staff_no::text='NIS000001-STF-000005' order by updated_at desc limit 3;"
          echo "=== recent staff photo metadata ==="
          psql "$TENANT_DATABASE_URL" -At -F '|' -c "select object_key,status,original_name,size_bytes,created_at from storage.object_metadata where object_key like '%/staff-photos/%' order by created_at desc limit 8;"
