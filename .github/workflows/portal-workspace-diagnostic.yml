name: Portal Workspace Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portal-workspace-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RAW_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Inspect linked records and role workspaces
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.RAW_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          TENANT_DATABASE_URL="$(ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.ADMIN_DATABASE_URL);
            u.pathname="/edusentia_nis_000001";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$ADMIN_DATABASE_URL"
          echo "::add-mask::$TENANT_DATABASE_URL"

          psql "$TENANT_DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          begin;

          select set_config('diag.tenant_id',(select id::text from app.tenants order by created_at limit 1),true);
          select set_config('diag.admin_id',coalesce((select id::text from public.profiles where public.current_app_role_for(role)::text='system_admin' and active order by created_at limit 1),''),true);
          select set_config('diag.principal_id',coalesce((select id::text from public.profiles where public.current_app_role_for(role)::text='principal' and active order by created_at limit 1),''),true);
          select set_config('diag.class_teacher_id',coalesce((select id::text from public.profiles where public.current_app_role_for(role)::text='class_teacher' and active order by created_at limit 1),''),true);
          select set_config('diag.subject_teacher_id',coalesce((select id::text from public.profiles where public.current_app_role_for(role)::text='subject_teacher' and active order by created_at limit 1),''),true);
          select set_config('diag.parent_id',coalesce((select id::text from public.profiles where public.current_app_role_for(role)::text='parent_guardian' and active order by created_at limit 1),''),true);
          select set_config('diag.student_id',coalesce((select id::text from public.profiles where public.current_app_role_for(role)::text='student' and active order by created_at limit 1),''),true);
          select set_config('diag.accountant_id',coalesce((select id::text from public.profiles where public.current_app_role_for(role)::text in ('accountant','accounts_office') and active order by created_at limit 1),''),true);
          select set_config('diag.accountant_role',coalesce((select public.current_app_role_for(role)::text from public.profiles where public.current_app_role_for(role)::text in ('accountant','accounts_office') and active order by created_at limit 1),'accountant'),true);
          select set_config('diag.teacher_count',(select count(*)::text from public.teachers where deleted_at is null and active),true);
          select set_config('diag.principal_count',(select count(*)::text from public.headteachers where deleted_at is null and active),true);
          select set_config('diag.accountant_count',(select count(*)::text from public.accounts_office_staff where deleted_at is null and active),true);
          select set_config('diag.student_count',(select count(*)::text from public.students where deleted_at is null and status='active'),true);

          set local role edusentia_worker_runtime;
          select app.set_request_context(
            current_setting('diag.tenant_id')::uuid,
            nullif(current_setting('diag.admin_id'),'')::uuid,
            'system_admin',
            2::smallint
          );

          do $diag$
          declare
            payload jsonb;
            workspace jsonb;
            profile jsonb;
            uid uuid;
            tenant_id uuid:=current_setting('diag.tenant_id')::uuid;
            accountant_role text:=current_setting('diag.accountant_role');
          begin
            payload:=public.list_profiles_with_access();
            raise notice 'LINKAGE_COUNTS underlying teachers=% principals=% accountants=% students=% payload_profiles=% payload_teachers=% payload_principals=% payload_accountants=% payload_students=% classes=% subjects=%',
              current_setting('diag.teacher_count')::integer,
              current_setting('diag.principal_count')::integer,
              current_setting('diag.accountant_count')::integer,
              current_setting('diag.student_count')::integer,
              jsonb_array_length(coalesce(payload->'profiles','[]'::jsonb)),
              jsonb_array_length(coalesce(payload->'teacher_records','[]'::jsonb)),
              jsonb_array_length(coalesce(payload->'headteacher_records','[]'::jsonb)),
              jsonb_array_length(coalesce(payload->'accountant_records','[]'::jsonb)),
              jsonb_array_length(coalesce(payload->'student_records','[]'::jsonb)),
              jsonb_array_length(coalesce(payload->'classes','[]'::jsonb)),
              jsonb_array_length(coalesce(payload->'subjects','[]'::jsonb));

            uid:=nullif(current_setting('diag.principal_id'),'')::uuid;
            if uid is null then
              raise notice 'ROLE principal ABSENT';
            else
              perform app.set_request_context(tenant_id,uid,'principal',2::smallint);
              begin
                workspace:=public.get_role_workspace();
                raise notice 'ROLE principal WORKSPACE_OK classes=% subjects=%',
                  jsonb_array_length(coalesce(workspace->'classes','[]'::jsonb)),
                  jsonb_array_length(coalesce(workspace->'subjects','[]'::jsonb));
              exception when others then
                raise notice 'ROLE principal WORKSPACE_ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;
            end if;

            uid:=nullif(current_setting('diag.class_teacher_id'),'')::uuid;
            if uid is null then
              raise notice 'ROLE class_teacher ABSENT';
            else
              perform app.set_request_context(tenant_id,uid,'class_teacher',2::smallint);
              begin
                profile:=public.get_my_teacher_profile();
                workspace:=public.get_role_workspace();
                raise notice 'ROLE class_teacher OK linked=% classes=% subjects=%',
                  coalesce((profile->>'linked')::boolean,false),
                  jsonb_array_length(coalesce(workspace->'classes','[]'::jsonb)),
                  jsonb_array_length(coalesce(workspace->'subjects','[]'::jsonb));
              exception when others then
                raise notice 'ROLE class_teacher ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;
            end if;

            uid:=nullif(current_setting('diag.subject_teacher_id'),'')::uuid;
            if uid is null then
              raise notice 'ROLE subject_teacher ABSENT';
            else
              perform app.set_request_context(tenant_id,uid,'subject_teacher',2::smallint);
              begin
                profile:=public.get_my_teacher_profile();
                workspace:=public.get_role_workspace();
                raise notice 'ROLE subject_teacher OK linked=% classes=% subjects=%',
                  coalesce((profile->>'linked')::boolean,false),
                  jsonb_array_length(coalesce(workspace->'classes','[]'::jsonb)),
                  jsonb_array_length(coalesce(workspace->'subjects','[]'::jsonb));
              exception when others then
                raise notice 'ROLE subject_teacher ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;
            end if;

            uid:=nullif(current_setting('diag.parent_id'),'')::uuid;
            if uid is null then
              raise notice 'ROLE parent_guardian ABSENT';
            else
              perform app.set_request_context(tenant_id,uid,'parent_guardian',2::smallint);
              begin
                workspace:=public.list_my_children_reports();
                raise notice 'ROLE parent_guardian OK payload_type=%',jsonb_typeof(workspace);
              exception when others then
                raise notice 'ROLE parent_guardian ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;
            end if;

            uid:=nullif(current_setting('diag.student_id'),'')::uuid;
            if uid is null then
              raise notice 'ROLE student ABSENT';
            else
              perform app.set_request_context(tenant_id,uid,'student',2::smallint);
              begin
                workspace:=public.get_my_student_portal_v2();
                raise notice 'ROLE student OK linked=% reports=%',
                  coalesce((workspace->>'linked')::boolean,false),
                  jsonb_array_length(coalesce(workspace->'reports','[]'::jsonb));
              exception when others then
                raise notice 'ROLE student ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;
            end if;

            uid:=nullif(current_setting('diag.accountant_id'),'')::uuid;
            if uid is null then
              raise notice 'ROLE accountant ABSENT';
            else
              perform app.set_request_context(tenant_id,uid,accountant_role,2::smallint);
              begin
                workspace:=public.finance_accounts_console(null,null,null);
                raise notice 'ROLE accountant OK payload_type=%',jsonb_typeof(workspace);
              exception when others then
                raise notice 'ROLE accountant ERROR role=% state=% message=%',accountant_role,SQLSTATE,SQLERRM;
              end;
            end if;
          end
          $diag$;

          rollback;
          SQL
