# final production candidate gate: r42-20260921
name: Worker Quality Gate
on:
  pull_request: {paths: ["frontend/**","worker/**","database/**","scripts/**","tests/**",".github/workflows/worker-check.yml"]}
  push: {branches: [main, reference-parity-r42], paths: ["frontend/**","worker/**","database/**","scripts/**","tests/**",".github/workflows/worker-check.yml"]}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
