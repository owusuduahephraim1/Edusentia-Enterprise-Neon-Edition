name: Worker Quality Gate
on:
  pull_request: {paths: ["worker/**","database/**","scripts/**"]}
  push: {branches: [main, reference-parity-r42], paths: ["worker/**","database/**","scripts/**"]}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
