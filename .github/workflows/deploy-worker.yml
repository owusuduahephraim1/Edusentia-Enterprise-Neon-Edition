name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "database/migrations/**"
      - "database/install-master.sh"
      - "database/runtime-role.sql"
      - "database/provisioner-role.sql"
      - "database/tenant-template/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Quality gates
        run: |
          npm run check
          npm test

      - id: deployment_config
        name: Check deployment configuration
        env:
          BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
          PRODUCTION_WORKER_DATABASE_URL: ${{ secrets.PRODUCTION_WORKER_DATABASE_URL }}
          PRODUCTION_PROVISIONER_DATABASE_URL: ${{ secrets.PRODUCTION_PROVISIONER_DATABASE_URL }}
          SESSION_PEPPER_VALUE: ${{ secrets.SESSION_PEPPER || secrets.AUTH_SECRET }}
          BOOTSTRAP_ADMIN_SECRET_VALUE: ${{ secrets.BOOTSTRAP_ADMIN_SECRET }}
          TURNSTILE_SECRET_VALUE: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          ready=true
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN is not configured for this repository."; ready=false; }
          [ -n "$BOOTSTRAP_DATABASE_URL" ] || { echo "::error::DATABASE_URL or NEON_DATABASE_URL is not configured for this repository."; ready=false; }
          [ -n "$PRODUCTION_WORKER_DATABASE_URL" ] || { echo "::error::PRODUCTION_WORKER_DATABASE_URL is not configured for this repository."; ready=false; }
          [ -n "$PRODUCTION_PROVISIONER_DATABASE_URL" ] || { echo "::error::PRODUCTION_PROVISIONER_DATABASE_URL is not configured for this repository."; ready=false; }
          [ -n "$SESSION_PEPPER_VALUE" ] || { echo "::error::SESSION_PEPPER or AUTH_SECRET is not configured for this repository."; ready=false; }
          [ -n "$BOOTSTRAP_ADMIN_SECRET_VALUE" ] || { echo "BOOTSTRAP_ADMIN_SECRET is not configured for this repository."; ready=false; }
          [ -n "$TURNSTILE_SECRET_VALUE" ] || { echo "TURNSTILE_SECRET is not configured for this repository."; ready=false; }
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo "::error::Production deployment requires complete dedicated service credentials."
            exit 1
          fi

      - name: Ensure private R2 bucket
        if: steps.deployment_config.outputs.ready == 'true'
        working-directory: worker
        run: |
          if npx wrangler r2 bucket info edusentia-enterprise-neon --json >/tmp/r2-info.json 2>/tmp/r2-info.err; then
            echo "R2 bucket already exists."
          else
            npx wrangler r2 bucket create edusentia-enterprise-neon
          fi

      - name: Create initial Worker deployment
        if: steps.deployment_config.outputs.ready == 'true'
        working-directory: worker
        run: |
          npx wrangler deploy 2>&1 | tee /tmp/initial-worker-deploy.log

      - name: Provision schema and install dedicated Neon service secrets
        if: steps.deployment_config.outputs.ready == 'true'
        env:
          BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
          PRODUCTION_WORKER_DATABASE_URL: ${{ secrets.PRODUCTION_WORKER_DATABASE_URL }}
          PRODUCTION_PROVISIONER_DATABASE_URL: ${{ secrets.PRODUCTION_PROVISIONER_DATABASE_URL }}
          SESSION_PEPPER_VALUE: ${{ secrets.SESSION_PEPPER || secrets.AUTH_SECRET }}
          BOOTSTRAP_ADMIN_SECRET_VALUE: ${{ secrets.BOOTSTRAP_ADMIN_SECRET }}
          TURNSTILE_SECRET_VALUE: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          ADMIN_DATABASE_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$ADMIN_DATABASE_URL"

          BOOTSTRAP_DATABASE_URL="$ADMIN_DATABASE_URL" bash database/install-master.sh

          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/runtime-role.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/provisioner-role.sql

          BOOTSTRAP_DATABASE_URL="$ADMIN_DATABASE_URL" TENANT_TEMPLATE_DATABASE="edusentia_tenant_template" bash database/tenant-template/install.sh

          echo "::add-mask::$PRODUCTION_WORKER_DATABASE_URL"
          echo "::add-mask::$PRODUCTION_PROVISIONER_DATABASE_URL"

          ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" PRODUCTION_WORKER_DATABASE_URL="$PRODUCTION_WORKER_DATABASE_URL" PRODUCTION_PROVISIONER_DATABASE_URL="$PRODUCTION_PROVISIONER_DATABASE_URL" node --input-type=module -e '
            const admin=new URL(process.env.ADMIN_DATABASE_URL);
            const worker=new URL(process.env.PRODUCTION_WORKER_DATABASE_URL);
            const provisioner=new URL(process.env.PRODUCTION_PROVISIONER_DATABASE_URL);
            if(worker.pathname!=="/edusentia"||worker.username!=="edusentia_worker_runtime")throw new Error("Production Worker database URL must target edusentia as edusentia_worker_runtime");
            if(!worker.hostname.includes("-pooler."))throw new Error("Production Worker database URL must use the pooled Neon endpoint");
            if(provisioner.pathname!=="/edusentia"||provisioner.username!=="edusentia_provisioner")throw new Error("Production provisioner database URL must target edusentia as edusentia_provisioner");
            if(provisioner.hostname!==admin.hostname||provisioner.hostname.includes("-pooler."))throw new Error("Production provisioner database URL must use the direct Neon endpoint");
            console.log("Production service database routes verified.");
          '

          (
            cd worker
            PRODUCTION_WORKER_DATABASE_URL="$PRODUCTION_WORKER_DATABASE_URL" PRODUCTION_PROVISIONER_DATABASE_URL="$PRODUCTION_PROVISIONER_DATABASE_URL" node --input-type=module -e '
              import { neon } from "@neondatabase/serverless";
              const worker=neon(process.env.PRODUCTION_WORKER_DATABASE_URL);
              const provisioner=neon(process.env.PRODUCTION_PROVISIONER_DATABASE_URL);
              const [wr,pr]=await Promise.all([
                worker`select current_user role, current_database() database`,
                provisioner`select current_user role, current_database() database, r.rolcreatedb, r.rolsuper, r.rolcreaterole, r.rolbypassrls from pg_roles r where r.rolname=current_user`
              ]);
              if(wr[0]?.role!=="edusentia_worker_runtime"||wr[0]?.database!=="edusentia")throw new Error("Production Worker identity verification failed");
              if(pr[0]?.role!=="edusentia_provisioner"||pr[0]?.database!=="edusentia"||!pr[0]?.rolcreatedb||pr[0]?.rolsuper||pr[0]?.rolcreaterole||pr[0]?.rolbypassrls)throw new Error("Production provisioner identity verification failed");
              console.log("Production Worker and provisioner database identities verified.");
            '
          )


          printf '%s' "$PRODUCTION_WORKER_DATABASE_URL" | (cd worker && npx wrangler secret put DATABASE_URL)
          printf '%s' "$PRODUCTION_PROVISIONER_DATABASE_URL" | (cd worker && npx wrangler secret put PROVISIONER_DATABASE_URL)
          printf '%s' "$SESSION_PEPPER_VALUE" | (cd worker && npx wrangler secret put SESSION_PEPPER)
          printf '%s' "$BOOTSTRAP_ADMIN_SECRET_VALUE" | (cd worker && npx wrangler secret put BOOTSTRAP_ADMIN_SECRET)
          if [ -n "$TURNSTILE_SECRET_VALUE" ]; then
            printf '%s' "$TURNSTILE_SECRET_VALUE" | (cd worker && npx wrangler secret put TURNSTILE_SECRET)
          fi

      - name: Final deploy and live health check
        id: live
        if: steps.deployment_config.outputs.ready == 'true'
        working-directory: worker
        run: |
          npx wrangler deploy 2>&1 | tee /tmp/final-worker-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/final-worker-deploy.log | tail -1)"
          test -n "$WORKER_URL" || { echo "Could not determine workers.dev URL"; exit 1; }
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$WORKER_URL/api/health" | tee /tmp/health.json
          node -e 'const fs=require("node:fs"); const h=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(!h.ok || !h.database || !h.storage) process.exit(1); console.log("Live Worker health check passed.")'
