name: Class Teacher Workspace Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/class-teacher-workspace-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RAW_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Inspect class teacher workspace RPCs
        shell: bash
        run: |
          set -euo pipefail
          TENANT_DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.RAW_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia_nis_000001";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$TENANT_DATABASE_URL"

          psql "$TENANT_DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          begin;

          select set_config('diag.user_id',coalesce((
            select p.id::text from public.profiles p
            where public.current_app_role_for(p.role)::text='class_teacher' and p.active
            order by p.created_at desc limit 1
          ),''),true);
          select set_config('diag.tenant_id',(select id::text from app.tenants order by created_at limit 1),true);
          select set_config('diag.term_id',coalesce((
            select id::text from public.terms where is_active and deleted_at is null order by start_date desc nulls last limit 1
          ),''),true);
          select set_config('diag.class_id',coalesce((
            select c.id::text
            from public.classes c
            where c.class_teacher_id=nullif(current_setting('diag.user_id'),'')::uuid
              and c.active and c.deleted_at is null
            order by c.level_order,c.name limit 1
          ),''),true);
          select set_config('diag.year_id',coalesce((
            select t.academic_year_id::text from public.terms t
            where t.id=nullif(current_setting('diag.term_id'),'')::uuid
          ),''),true);
          select set_config('diag.school_date',coalesce((
            select greatest(coalesce(t.start_date,current_date),least(current_date,coalesce(t.end_date,current_date)))::text
            from public.terms t where t.id=nullif(current_setting('diag.term_id'),'')::uuid
          ),current_date::text),true);

          select 'TEACHER_CONTEXT '||jsonb_build_object(
            'user_id',nullif(current_setting('diag.user_id'),''),
            'term_id',nullif(current_setting('diag.term_id'),''),
            'class_id',nullif(current_setting('diag.class_id'),''),
            'teacher_record',(select id from public.teachers where profile_id=nullif(current_setting('diag.user_id'),'')::uuid and active and deleted_at is null limit 1)
          )::text;

          set local role edusentia_worker_runtime;
          select app.set_request_context(
            current_setting('diag.tenant_id')::uuid,
            nullif(current_setting('diag.user_id'),'')::uuid,
            'class_teacher',
            1::smallint
          );

          do $diag$
          declare
            uid uuid:=nullif(current_setting('diag.user_id'),'')::uuid;
            termid uuid:=nullif(current_setting('diag.term_id'),'')::uuid;
            classid uuid:=nullif(current_setting('diag.class_id'),'')::uuid;
            schooldate date:=current_setting('diag.school_date')::date;
            yearid uuid:=nullif(current_setting('diag.year_id'),'')::uuid;
            studentid uuid;
            v jsonb;
            entries jsonb;
          begin
            if uid is null then raise exception 'No active class teacher user exists'; end if;

            begin
              v:=public.get_my_teacher_profile();
              raise notice 'RPC_PROFILE_OK linked=% classes=% subjects=%',
                coalesce((v->>'linked')::boolean,false),
                jsonb_array_length(coalesce(v->'classes','[]'::jsonb)),
                jsonb_array_length(coalesce(v->'subjects','[]'::jsonb));
            exception when others then
              raise notice 'RPC_PROFILE_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              v:=public.get_role_workspace();
              raise notice 'RPC_WORKSPACE_OK classes=% subjects=%',
                jsonb_array_length(coalesce(v->'classes','[]'::jsonb)),
                jsonb_array_length(coalesce(v->'subjects','[]'::jsonb));
            exception when others then
              raise notice 'RPC_WORKSPACE_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            if termid is not null then
              begin
                v:=public.list_my_attendance_classes(termid);
                raise notice 'RPC_ATTENDANCE_CLASSES_OK count=%',jsonb_array_length(coalesce(v,'[]'::jsonb));
              exception when others then
                raise notice 'RPC_ATTENDANCE_CLASSES_ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;

              begin
                v:=public.academic_analytics(termid,null);
                raise notice 'RPC_INSIGHTS_ALL_OK students=% reports=% classes=%',
                  coalesce(v#>>'{summary,students}','0'),
                  coalesce(v#>>'{summary,reports}','0'),
                  jsonb_array_length(coalesce(v->'classes','[]'::jsonb));
              exception when others then
                raise notice 'RPC_INSIGHTS_ALL_ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;
            end if;

            if termid is not null and classid is not null then
              begin
                v:=public.get_class_attendance_register(termid,classid,schooldate);
                raise notice 'RPC_ATTENDANCE_REGISTER_OK students=% opened=%',
                  jsonb_array_length(coalesce(v->'students','[]'::jsonb)),
                  coalesce(v->>'days_school_opened','0');
              exception when others then
                raise notice 'RPC_ATTENDANCE_REGISTER_ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;

              begin
                v:=public.academic_analytics(termid,classid);
                raise notice 'RPC_INSIGHTS_CLASS_OK students=% reports=% classes=%',
                  coalesce(v#>>'{summary,students}','0'),
                  coalesce(v#>>'{summary,reports}','0'),
                  jsonb_array_length(coalesce(v->'classes','[]'::jsonb));
              exception when others then
                raise notice 'RPC_INSIGHTS_CLASS_ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;

              begin
                v:=public.search_students_v5('',classid,null,'active',1,20);
                raise notice 'RPC_STUDENTS_OK total=% rows=%',
                  coalesce(v->>'total','0'),
                  jsonb_array_length(coalesce(v->'rows','[]'::jsonb));
              exception when others then
                raise notice 'RPC_STUDENTS_ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;

              begin
                v:=public.list_report_cards_v6(termid,classid,null,'','active',1,20);
                raise notice 'RPC_REPORTS_OK total=% rows=%',
                  coalesce(v->>'total','0'),
                  jsonb_array_length(coalesce(v->'rows','[]'::jsonb));
              exception when others then
                raise notice 'RPC_REPORTS_ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;

              if yearid is not null then
                begin
                  v:=public.get_class_timetable_console(yearid,classid);
                  raise notice 'RPC_TIMETABLE_OK entries=%',
                    jsonb_array_length(coalesce(v->'entries','[]'::jsonb));
                exception when others then
                  raise notice 'RPC_TIMETABLE_ERROR state=% message=%',SQLSTATE,SQLERRM;
                end;
              end if;

              begin
                v:=public.search_students_v5('',classid,'active','active',1,20);
                studentid:=nullif(v#>>'{rows,0,id}','')::uuid;
                if studentid is not null then
                  v:=public.get_student_academic_history(studentid);
                  raise notice 'RPC_HISTORY_OK student=%',studentid;
                else
                  raise notice 'RPC_HISTORY_SKIPPED no accessible active student';
                end if;
              exception when others then
                raise notice 'RPC_HISTORY_ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;

              begin
                v:=public.get_class_attendance_register(termid,classid,schooldate);
                select coalesce(jsonb_agg(jsonb_build_object(
                  'enrollment_id',item->>'enrollment_id',
                  'attendance_status',coalesce(nullif(item->>'attendance_status',''),'present')
                )),'[]'::jsonb) into entries
                from jsonb_array_elements(coalesce(v->'students','[]'::jsonb)) item;
                if jsonb_array_length(entries)>0 then
                  v:=public.save_class_attendance(termid,classid,schooldate,entries,'Transactional Class Teacher workspace diagnostic');
                  raise notice 'RPC_ATTENDANCE_SAVE_OK students=%',jsonb_array_length(coalesce(v->'students','[]'::jsonb));
                else
                  raise notice 'RPC_ATTENDANCE_SAVE_SKIPPED no enrolled students';
                end if;
              exception when others then
                raise notice 'RPC_ATTENDANCE_SAVE_ERROR state=% message=%',SQLSTATE,SQLERRM;
              end;
            end if;

            begin
              v:=public.get_role_dashboard(termid);
              raise notice 'RPC_DASHBOARD_OK assigned_classes=% assigned_subjects=%',
                coalesce(v->>'assigned_classes','0'),coalesce(v->>'assigned_subjects','0');
            exception when others then
              raise notice 'RPC_DASHBOARD_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              v:=public.list_notifications(1,10);
              raise notice 'RPC_NOTIFICATIONS_OK total=% unread=%',
                coalesce(v->>'total','0'),coalesce(v->>'unread','0');
            exception when others then
              raise notice 'RPC_NOTIFICATIONS_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;

            begin
              raise notice 'RPC_GRANTS analytics=% workspace=% profile=% attendance_classes=% attendance_register=% save_attendance=%',
                has_function_privilege(current_user,'public.academic_analytics(uuid,uuid)','execute'),
                has_function_privilege(current_user,'public.get_role_workspace()','execute'),
                has_function_privilege(current_user,'public.get_my_teacher_profile()','execute'),
                has_function_privilege(current_user,'public.list_my_attendance_classes(uuid)','execute'),
                has_function_privilege(current_user,'public.get_class_attendance_register(uuid,uuid,date)','execute'),
                has_function_privilege(current_user,'public.save_class_attendance(uuid,uuid,date,jsonb,text)','execute');
            exception when others then
              raise notice 'RPC_GRANTS_ERROR state=% message=%',SQLSTATE,SQLERRM;
            end;
          end
          $diag$;

          rollback;
          SQL
