name: Admission Reuse Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/admission-reuse-diagnostic.yml"
      - "scripts/admission-reuse-diagnostic.sh"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Run admission reuse diagnostic
        run: bash scripts/admission-reuse-diagnostic.sh
