name: Admission Reuse Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admission-reuse-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Inspect production admission reuse
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_DATABASE_URL="$(BOOTSTRAP_DATABASE_URL="$BOOTSTRAP_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.BOOTSTRAP_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          TENANT_DATABASE_URL="$(ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.ADMIN_DATABASE_URL);
            u.pathname="/edusentia_nis_000001";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$ADMIN_DATABASE_URL"
          echo "::add-mask::$TENANT_DATABASE_URL"

          echo "migration_count=$(psql "$TENANT_DATABASE_URL" -Atc "select count(*) from app.schema_migrations where version in(
            '0049a_operational_finance_reference','0049b_hr_staff_management','0049c_hr_staff_hardening',
            '0049d_student_services_foundation','0049e_admissions_management','0049f_admissions_actions',
            '0049g_admissions_enrollment_reversal','0049h_admissions_core_student_compat',
            '0049i_discipline_welfare','0049j_health_clinic','0049k_communications','0049l_hostel_boarding',
            '0049m_alumni','0049n_student_services_directory','0049o_student_services_reference',
            '0049p_student_services_hostel_bridge','0049q_student_services_resolution',
            '0049r_student_services_hardening','0049s_user_student_guardian_linkage','0049t_student_portal',
            '0049u_student_portal_report_attendance_fix','0049v_live_plan_feature_parity','0049w_school_identity_logo_parity',
            '0049x_class_scoped_student_admission_numbers','0049y_audit_permanent_reset','0049z_operational_runtime_grants',
            '0051_r2_upload_metadata_api','0052_school_logo_tenant_context_fix','0053_blueprint_template_path_parity',
            '0054_shs_operational_parity','0055_teacher_photo_r2_authorization','0056_teacher_photo_neon_context_fix',
            '0057_teacher_photo_reference_contract','0058_reusable_student_admission_numbers'
          )")"

          psql "$TENANT_DATABASE_URL" -At -F '|' <<'SQL'
select 'global_constraint_absent',not exists(select 1 from pg_constraint where conrelid='public.students'::regclass and conname='students_admission_no_key');
select 'active_index_exists',to_regclass('public.students_admission_no_ci_idx') is not null;
select 'generator_exists',to_regprocedure('public.next_student_identifier_for_prefix(text)') is not null;
select 'generator_has_series',position('generate_series(1,999)' in replace(pg_get_functiondef('public.next_student_identifier_for_prefix(text)'::regprocedure),' ',''))>0;
select 'generator_active_only',position('s.deleted_at is null' in pg_get_functiondef('public.next_student_identifier_for_prefix(text)'::regprocedure))>0;
select 'restore_reallocates',position('public.next_student_identifier_for_prefix' in pg_get_functiondef('public.restore_student(uuid,text)'::regprocedure))>0;
select 'save_active_only',position('s.deleted_at is null' in pg_get_functiondef('public.save_student(jsonb)'::regprocedure))>0;
select 'migration_0058',exists(select 1 from app.schema_migrations where version='0058_reusable_student_admission_numbers');
SQL

          echo "=== functional rollback test ==="
          psql "$TENANT_DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
begin;
set local role edusentia_worker_runtime;
select app.set_request_context(
  (select id from app.tenants order by created_at limit 1),
  (select id from public.profiles where public.current_app_role_for(role)='system_admin' and active order by created_at limit 1),
  'system_admin',
  2::smallint
);
do $test$
declare
  y uuid;
  c uuid;
  a jsonb;
  b jsonb;
  aid uuid;
  bid uuid;
  ano text;
  bno text;
begin
  select id into y from public.academic_years where deleted_at is null order by is_active desc,start_date desc nulls last,created_at limit 1;
  select id into c from public.classes where deleted_at is null and active order by level_order,name limit 1;
  if y is null or c is null then raise exception 'diagnostic needs an academic year and class'; end if;

  a:=public.save_student(jsonb_build_object(
    'student',jsonb_build_object('first_name','ReuseDiagA','last_name','Student','gender','Other','status','active'),
    'enrollment',jsonb_build_object('academic_year_id',y,'class_id',c,'active',true),
    'guardian',jsonb_build_object(),
    'reason','Admission reuse diagnostic'
  ));
  aid:=(a#>>'{student,id}')::uuid;
  ano:=a#>>'{student,admission_no}';
  perform public.archive_student(aid,'Admission reuse diagnostic archive');

  b:=public.save_student(jsonb_build_object(
    'student',jsonb_build_object('first_name','ReuseDiagB','last_name','Student','gender','Other','status','active'),
    'enrollment',jsonb_build_object('academic_year_id',y,'class_id',c,'active',true),
    'guardian',jsonb_build_object(),
    'reason','Admission reuse diagnostic replacement'
  ));
  bid:=(b#>>'{student,id}')::uuid;
  bno:=b#>>'{student,admission_no}';

  if bno is distinct from ano then
    raise exception 'admission_not_reused: expected %, got %',ano,bno;
  end if;
  raise notice 'ADMISSION_REUSE_OK|%|%',ano,bno;
end
$test$;
rollback;
SQL
