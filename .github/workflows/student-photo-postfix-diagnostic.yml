name: Student Photo Postfix Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/student-photo-postfix-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RAW_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify production student photograph contract
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_DATABASE_URL="$(RAW_DATABASE_URL="$RAW_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.RAW_DATABASE_URL);
            u.hostname=u.hostname.replace("-pooler.",".");
            u.pathname="/edusentia";
            process.stdout.write(u.toString());
          ')"
          TENANT_DATABASE_URL="$(ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" node --input-type=module -e '
            const u=new URL(process.env.ADMIN_DATABASE_URL);
            u.pathname="/edusentia_nis_000001";
            process.stdout.write(u.toString());
          ')"
          echo "::add-mask::$ADMIN_DATABASE_URL"
          echo "::add-mask::$TENANT_DATABASE_URL"

          psql "$TENANT_DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          begin;
          select app.set_request_context(
            (select id from app.tenants order by created_at limit 1),
            (select id from public.profiles where public.current_app_role_for(role)='system_admin' and active order by created_at limit 1),
            'system_admin',
            2::smallint
          );

          do $verify$
          declare
            sid uuid;
            p text;
            descriptor jsonb;
            key text;
            tid uuid:=app.current_tenant_id();
          begin
            if not exists(select 1 from app.schema_migrations where version='0059_student_photo_r2_contract') then
              raise exception '0059 student photo migration is not installed';
            end if;

            if position('app.current_user_id()' in pg_get_functiondef('public.set_student_photo(uuid,text,timestamptz)'::regprocedure))=0 then
              raise exception 'set_student_photo is not using Neon request context';
            end if;
            if position('storage.object_metadata' in pg_get_functiondef('public.set_student_photo(uuid,text,timestamptz)'::regprocedure))=0 then
              raise exception 'set_student_photo is not verifying R2 metadata';
            end if;
            if to_regprocedure('public.neon_student_photo_descriptor(uuid)') is null then
              raise exception 'student photo descriptor is missing';
            end if;

            select s.id,s.photo_url into sid,p
            from public.students s
            where btrim(coalesce(s.photo_url,''))<>''
            order by s.updated_at desc nulls last
            limit 1;

            if sid is null or coalesce(p,'')='' then
              raise exception 'No student photograph row exists for production verification';
            end if;

            descriptor:=public.neon_student_photo_descriptor(sid);
            if descriptor->>'photo_url' is distinct from p then
              raise exception 'Student photo descriptor path does not match the student record';
            end if;

            if p like ('tenants/'||tid::text||'/student-photos/%') then
              key:=p;
            else
              key:='tenants/'||tid::text||'/student-photos/'||p;
            end if;

            if not exists(
              select 1 from storage.object_metadata m
              where m.tenant_id=tid
                and m.object_key=key
                and m.status='active'
                and lower(m.content_type) like 'image/%'
            ) then
              raise exception 'Student photo does not have active image metadata for its R2 object key';
            end if;

            raise notice 'STUDENT_PHOTO_POSTFIX_OK';
          end
          $verify$;
          rollback;
          SQL
